# pnpm 11 以降、非 registry / 非 auth の設定はこのファイルが正本（`.npmrc` からは読まれない）。
# supply-chain の既定は pnpm 11 側で有効: `minimumReleaseAge` = 1440 分、`blockExoticSubdeps` = on。
# ここで再宣言しないのは default と同値だからで、無効化しているわけではない。
packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  sharp: true
  supabase: true
  unrs-resolver: true
audit:
  # image-size 2.0.2 に未リリースの上流修正を適用済みの advisory だけを除外する
  ignore:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
overrides:
  # Vaul/cmdk と直接利用する Dialog が同じ dismissable-layer を共有する (#2661)。
  '@radix-ui/react-dialog': '1.1.20'
  tar: '^7.5.4'
  tmp: '^0.2.4'
  '@types/react': '19.2.17'
  '@types/react-dom': '19.2.3'
  # security: Dependabot alerts解消 (#1569)
  # 同一 major に閉じる `^` で上限を付け、意図せぬメジャー更新を防ぐ
  hono: '^4.13.5'
  dompurify: '^3.4.13'
  esbuild: '^0.28.1'
  # js-yaml v4: selector を脆弱域全体にする。requester ごとに宣言 range が違い
  # （cosmiconfig `^4.1.0` / @eslint/eslintrc `^4.3.0`）、単一 version の
  # selector では片方しか置換されない (GHSA-2883-xcg3-v3hh)
  'js-yaml@>=4.0.0 <4.3.2': '^4.3.2'
  'postcss@8.4.31': '^8.5.16'
  '@babel/core@7.29.0': '^7.29.7'
  # upstream が修正版を取り込むまで、脆弱な間接依存だけを置換する (#1569)
  'sharp@<0.35.0': '^0.35.3'
  'valibot@1.2.0': '^1.4.2'
  'js-yaml@3.14.2': '3.15.2'
  'uuid@8.3.2': '11.1.1'
  # postcss 経由の間接依存。ビルド時ツールチェーン経由（devDependency の
  # Storybook/Tailwind に加え、@sentry/nextjs のビルドプラグイン peer chain を含む。
  # 実行時 bundle 非搭載）。size=0 での無限ループ DoS (GHSA-2v37-7h3g-55p8) を解消する (#2108)
  'nanoid@3.3.17': '^3.3.18'
  # security sweep (claude-security スキャン, 2026-09-06) で pnpm audit が拾った
  # 間接依存。いずれも patch レベルの上げ幅で修正版が出ているため、既存方針どおり
  # 脆弱な version だけを狙って置換する。
  # fast-uri: ajv 経由（@modelcontextprotocol/sdk / @sentry/nextjs / Storybook）。
  #   SSRF と host confusion の 4 件 (GHSA-5jgf-p345-68v8 ほか)
  'fast-uri@3.1.5': '^3.1.6'
  # browserslist: prototype write と無制限メモリ増加の 2 件
  #   (GHSA-73wf-gq98-2v4g / GHSA-c83g-rgw3-j3cx)。lockfile 内に 4.28.6 と 4.28.7 が
  #   混在していたので、脆弱な 4.28.6 側だけを揃える
  'browserslist@4.28.6': '^4.28.7'
  # qs: express 経由の DoS と array-limit bypass
  #   (GHSA-4mjr-xmp4-gh2g / GHSA-x5fp-wj9c-mxmx)
  'qs@6.15.3': '^6.15.4'
  # smol-toml: knip 経由（宣言は `^1.5.2` だが lockfile が 1.7.0 に固定されて
  #   いた）。TOML parse の DoS (GHSA-7w5x-hrqm-74c2)。devDependency のみ
  'smol-toml@1.7.0': '^1.7.1'
  # extract-zip (GHSA-jmr9-qjv8-65gv) は **ここに入れられない**。advisory は
  # `>=2.0.2` を修正版と書くが 2.0.2 は未リリースで、最新が 2.0.1（override を
  # 書くと ERR_PNPM_NO_MATCHING_VERSION で install が落ちる）。経路は
  # @lhci/cli -> lighthouse -> puppeteer-core -> @puppeteer/browsers の
  # devDependency のみで production bundle に載らない。上流が出すまで
  # `pnpm security:check` に出続けるのを許容する（ignoreGhsas へ入れない —
  # 局所パッチのような緩和実体が無いため、隠すと再評価の機会を失う）。
# image-size 2.0.2 の未リリース上流修正を固定する。
# GHSA-w3rx-r6r6-pgpr / GHSA-5p2g-fcmc-qvqq は patchedDependencies で緩和済み。
patchedDependencies:
  image-size@2.0.2: patches/image-size@2.0.2.patch

# 2 workspace 以上で共有する dependency の version range 正本 (#2518)。
# 分類規則: dependencies に一度でも現れるものは catalog(default)、devDependencies だけのものは catalogs.tooling。
# catalog に入れないもの:
#   - zod / @hookform/resolvers: apps/product v3 系・apps/web v4 系の意図的な skew (AGENTS.md)
#   - @types/react / @types/react-dom: 上の overrides で exact pin 済み。catalog にすると二重管理になる
#   - peerDependencies のエントリ: 「受け入れ可能な幅」の宣言であり、揃えるべき固定 version ではない
catalog:
  '@marsidev/react-turnstile': '^1.5.3'
  '@sentry/nextjs': '^10.66.0'
  '@tailwindcss/typography': '^0.5.20'
  '@tanstack/react-query': '^5.101.2'
  '@trpc/client': '^11.18.0'
  '@trpc/server': '^11.18.0'
  '@upstash/ratelimit': '^2.0.8'
  '@upstash/redis': '^1.38.0'
  '@vercel/analytics': '^1.6.1'
  '@vercel/speed-insights': '^1.3.1'
  class-variance-authority: '^0.7.1'
  clsx: '^2.1.1'
  cmdk: '^1.1.1'
  glob: '^13.0.6'
  lucide-react: '^0.577.0'
  next: '^16.3.3'
  next-intl: '^4.13.2'
  next-themes: '^0.4.6'
  react: '^19.2.7'
  react-dom: '^19.2.7'
  react-hook-form: '^7.82.0'
  remark-gfm: '^4.0.1'
  resend: '^6.17.2'
  server-only: '^0.0.1'
  sonner: '^2.0.7'
  tailwind-merge: '^3.6.0'
  zustand: '^5.0.14'
catalogs:
  tooling:
    '@axe-core/playwright': '^4.12.1'
    '@axe-core/react': '^4.12.1'
    '@lhci/cli': '^0.15.1'
    '@next/bundle-analyzer': '^16.3.3'
    '@playwright/test': '^1.61.1'
    '@storybook/addon-a11y': '^10.5.2'
    '@storybook/addon-docs': '^10.5.2'
    '@storybook/addon-mcp': '^0.7.0'
    '@storybook/addon-vitest': '^10.5.2'
    '@storybook/nextjs-vite': '^10.5.2'
    '@tailwindcss/postcss': '^4.3.3'
    '@testing-library/dom': '^10.4.1'
    '@testing-library/jest-dom': '^6.9.1'
    '@testing-library/react': '^16.3.2'
    '@testing-library/user-event': '^14.6.1'
    '@types/qrcode': '^1.5.6'
    '@vitejs/plugin-react': '^5.2.0'
    '@vitest/browser-playwright': '^4.1.11'
    '@vitest/coverage-istanbul': '^4.1.11'
    '@vitest/ui': '^4.1.11'
    '@vueless/storybook-dark-mode': '^10.0.8'
    babel-plugin-react-compiler: '^1.0.0'
    eslint: '^9.39.5'
    eslint-config-next: '^16.3.3'
    eslint-plugin-storybook: '^10.5.2'
    eslint-plugin-tailwindcss: '^4.2.0'
    happy-dom: '^20.11.0'
    husky: '^9.1.7'
    knip: '^5.88.1'
    license-checker: '^25.0.1'
    madge: '^8.0.0'
    npm-check-updates: '^19.6.6'
    playwright: '^1.61.1'
    postcss: '^8.5.23'
    prettier: '^3.9.5'
    prettier-plugin-organize-imports: '^4.3.0'
