          map.querySelectorAll('.tag').forEach(function (t) {
            t.remove();
          });
          svg.setAttribute('width', map.clientWidth);
          svg.setAttribute('height', map.clientHeight);
          var defs = svgEl('defs');
          [
            ['s-off', 'var(--wire)'],
            ['s-on', 'var(--accent)'],
          ].forEach(function (m) {
            var marker = svgEl('marker', {
              id: m[0],
              viewBox: '0 0 10 10',
              refX: '8',
              refY: '5',
              markerWidth: '8',
              markerHeight: '8',
              markerUnits: 'userSpaceOnUse',
              orient: 'auto-start-reverse',
            });
            var tri = svgEl('path', { d: 'M0,0 L10,5 L0,10 z' });
            tri.setAttribute('style', 'fill: ' + m[1]);
            marker.appendChild(tri);
            defs.appendChild(marker);
          });
          svg.appendChild(defs);
          var base = map.getBoundingClientRect();
          function box(id) {
            var r = map.querySelector('[data-scr="' + id + '"]').getBoundingClientRect();
            return {
              l: r.left - base.left,
              r: r.right - base.left,
              cy: r.top - base.top + r.height / 2,
            };
          }
          var byId = {};
          S.nodes.forEach(function (n) {
            byId[n.id] = n;
          });
          var onPaths = [];
          S.edges.forEach(function (e) {
            var a = box(e[0]);
            var b = box(e[1]);
            var ca = byId[e[0]].col;
            var cb = byId[e[1]].col;
            var d;
            if (cb > ca) {
              var mx = (a.r + b.l) / 2;
              d =
                'M' +
                a.r +
                ',' +
                a.cy +
                ' C' +
                mx +
                ',' +
                a.cy +
                ' ' +
                mx +
                ',' +
                b.cy +
                ' ' +
                (b.l - 2) +
                ',' +
                b.cy;
            } else if (cb < ca) {
              var mx2 = (a.l + b.r) / 2;
              d =
                'M' +
                a.l +
                ',' +
                a.cy +
                ' C' +
                mx2 +
                ',' +
                a.cy +
                ' ' +
                mx2 +
                ',' +
                b.cy +
                ' ' +
                (b.r + 2) +
                ',' +
                b.cy;
            } else if (byId[e[0]].row < byId[e[1]].row) {
              d =
                'M' +
                a.r +
                ',' +
                (a.cy + 6) +
                ' C' +
                (a.r + 30) +
                ',' +
                (a.cy + 6) +
                ' ' +
                (b.r + 30) +
                ',' +
                (b.cy - 6) +
                ' ' +
                (b.r + 2) +
                ',' +
                (b.cy - 6);
            } else {
              d =
                'M' +
                a.l +
                ',' +
                (a.cy - 6) +
                ' C' +
                (a.l - 30) +
                ',' +
                (a.cy - 6) +
                ' ' +
                (b.l - 30) +
                ',' +
                (b.cy + 6) +
                ' ' +
                (b.l - 2) +
                ',' +
                (b.cy + 6);
            }
            var on = e[0] === cur.id || e[1] === cur.id;
            var path = svgEl('path', { d: d, class: 'scr-edge' + (on ? ' on' : '') });
            path.setAttribute('marker-end', on ? 'url(#s-on)' : 'url(#s-off)');
            if (on) onPaths.push([path, e[2]]);
            else svg.appendChild(path);
          });
          onPaths.forEach(function (p) {
            svg.appendChild(p[0]);
            var len = p[0].getTotalLength();
            var pt = p[0].getPointAtLength(len / 2);
            map.appendChild(
              el('span', {
                class: 'tag on',
                style: 'left:' + pt.x + 'px; top:' + pt.y + 'px',
                text: p[1],
              }),
            );
          });
        }

        // ---------- 停止マップ ----------
        function renderOutages() {
          var o = data.outages;
          viewEl.textContent = '';
          viewEl.appendChild(
            pageHead('地図', o.title, o.intro, [
              el('span', { text: o.items.length + ' サービス' }),
              el('span', { text: o.features.length + ' 機能' }),
            ]),
          );
          if (!state.outage) state.outage = o.items[0].id;
          var current = o.items.filter(function (it) {
            return it.id === state.outage;
          })[0];

          var deps = el('div', {
            class: 'deps has-pick',
            id: 'deps',
            role: 'group',
            'aria-label': '外部サービスと機能の依存図',
          });
          var left = el('div', { class: 'col' }, [
            el('div', { class: 'col-h', text: '外部サービス（押すと止まる）' }),
          ]);
          o.items.forEach(function (it) {
            var b = el(
              'button',
              {
                class: 'svc-node',
                type: 'button',
                'data-svc': it.id,
                style: svcVar(it.svc),
                'aria-pressed': String(it.id === state.outage),
              },
              [el('b', { text: it.name }), el('small', { text: it.role })],
            );
            b.addEventListener('click', function () {
              state.outage = it.id;
              renderOutages();
            });
            left.appendChild(b);
          });
          var right = el('div', { class: 'col feat' }, [
            el('div', { class: 'col-h', text: '機能' }),
          ]);
          o.features.forEach(function (f) {
            var impact = current.impacts[f.id];
            right.appendChild(
              el('div', { class: 'feat-node ' + (impact || 'safe'), 'data-feat': f.id }, [
                f.label,
                impact ? el('small', { text: impact === 'down' ? '✕ 止まる' : '△ 弱まる' }) : null,
              ]),
            );
          });
          deps.appendChild(left);
          deps.appendChild(right);
          deps.appendChild(svgEl('svg', { class: 'wires', 'aria-hidden': 'true' }));

          var legend = el('div', { class: 'legend' }, [
            el('span', { class: 's-bad' }, [el('i', {}), '止まる']),
            el('span', { class: 's-warn' }, [
              el('i', { class: 'dash' }),
              '弱まる（一部・遅れて追いつく）',
            ]),
          ]);

          var panel = el('section', { class: 'panel', 'aria-live': 'polite' });
          panel.appendChild(
            el('div', {}, [
              el('span', { class: 'svc-chip', style: svcVar(current.svc), text: current.role }),
            ]),
          );
          panel.appendChild(el('h2', { text: current.name + ' が止まったら' }));
          var impactTiles = el(
            'div',
            { class: 'tiles' },
            [
              ['壊れる', current.breaks, 'bad'],
              ['動き続ける', current.keeps, 'ok'],
              ['コードの挙動', current.behavior, 'neutral'],
              ['関係する env', current.env.length ? current.env.join(', ') : '（なし）', 'neutral'],
            ].map(function (t) {
              return el('div', { class: 'tile s-' + t[2] }, [
                el('span', { class: 'h', text: t[0] }),
                el('p', { text: t[1] }),
              ]);
            }),
          );
          panel.appendChild(impactTiles);
          panel.appendChild(
            el('div', { class: 'look' }, [
              el('strong', { text: '→ 最初に見る場所' }),
              current.look,
            ]),
          );
          panel.appendChild(el('h3', { text: 'コードと文書' }));
          panel.appendChild(refList(current.refs));
          panel.appendChild(
            el('p', {
              class: 'why',
              text: 'env は名前だけを載せる。値は 1Password が正本（docs/operations/secrets.md）。',
            }),
          );

          viewEl.appendChild(el('div', { class: 'stage' }, [el('div', {}, [deps, legend]), panel]));
          drawEdges(current);
          if (window.ResizeObserver) {
            resizeObserver = new ResizeObserver(function () {
              drawEdges(current);
            });
            resizeObserver.observe(deps);
          }
        }

        function drawEdges(current) {
          var deps = document.getElementById('deps');
          if (!deps) return;
          var svg = deps.querySelector('svg.wires');
          svg.textContent = '';
          svg.setAttribute('width', deps.clientWidth);
          svg.setAttribute('height', deps.clientHeight);
          var base = deps.getBoundingClientRect();
          var picked = [];
          data.outages.items.forEach(function (it) {
            var a = deps.querySelector('[data-svc="' + it.id + '"]').getBoundingClientRect();
            Object.keys(it.impacts).forEach(function (fid) {
              var b = deps.querySelector('[data-feat="' + fid + '"]').getBoundingClientRect();
              var x1 = a.right - base.left;
              var y1 = a.top - base.top + a.height / 2;
              var x2 = b.left - base.left;
              var y2 = b.top - base.top + b.height / 2;
              var mx = (x1 + x2) / 2;
              var d =
                'M' +
                x1 +
                ',' +
                y1 +
                ' C' +
                mx +
                ',' +
                y1 +
                ' ' +
                mx +
                ',' +
                y2 +
                ' ' +
                x2 +
                ',' +
                y2;
              var mine = it.id === current.id;
              var path = svgEl('path', { d: d, class: 'edge ' + (mine ? it.impacts[fid] : 'off') });
              if (mine) picked.push(path);
              else svg.appendChild(path);
            });
          });
          // 選んだサービスの線を最前面に
          picked.forEach(function (p) {
            svg.appendChild(p);
          });
        }

        render();
      })();
    </script>
  </body>
</html>
