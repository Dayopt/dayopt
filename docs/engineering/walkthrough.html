<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dayopt 経路ウォークスルー</title>
    <!--
      Dayopt の仕組みを触って学ぶ教材。操作 → 通る処理 → 失敗点 → 画面・データ・再試行への影響を辿る。
      内容は下の JSON（id="walkthrough-data"）が正本。
      refs の {path, find} は `pnpm docs:check`（walkthrough-refs）が「ファイルが在り、find の文字列を含む」ことを検査する。
      行番号は持たない（ずれるため）。コードを動かしたら find を追従させる。
      外部 script / CSS / font は使わない（file:// で開ける状態を保つ）。
    -->
    <style>
      :root {
        --bg: #fbfaf8;
        --surface: #ffffff;
        --surface-2: #f3f1ed;
        --text: #1d1c1a;
        --muted: #6b675f;
        --border: #e2ded6;
        --accent: #2f5bd3;
        --danger: #c0392b;
        --danger-bg: #fdf0ee;
        --ok: #1e7b4f;
        --svc-browser: #2f5bd3;
        --svc-vercel: #1d1c1a;
        --svc-supabase: #1e8a5a;
        --svc-resend: #8a4bd6;
        --svc-github: #b8641b;
        --svc-external: #6b675f;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #161614;
          --surface: #1f1e1c;
          --surface-2: #2a2926;
          --text: #ecebe7;
          --muted: #a29e95;
          --border: #3a3834;
          --accent: #7d9df0;
          --danger: #f08274;
          --danger-bg: #3a2320;
          --ok: #6fcf9c;
          --svc-browser: #7d9df0;
          --svc-vercel: #ecebe7;
          --svc-supabase: #5ccf97;
          --svc-resend: #b98cf0;
          --svc-github: #e0a263;
          --svc-external: #a29e95;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --bg: #161614;
        --surface: #1f1e1c;
        --surface-2: #2a2926;
        --text: #ecebe7;
        --muted: #a29e95;
        --border: #3a3834;
        --accent: #7d9df0;
        --danger: #f08274;
        --danger-bg: #3a2320;
        --ok: #6fcf9c;
        --svc-browser: #7d9df0;
        --svc-vercel: #ecebe7;
        --svc-supabase: #5ccf97;
        --svc-resend: #b98cf0;
        --svc-github: #e0a263;
        --svc-external: #a29e95;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.7 -apple-system,
          BlinkMacSystemFont,
          'Hiragino Sans',
          'Noto Sans JP',
          sans-serif;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.88em;
        background: var(--surface-2);
        padding: 0.05em 0.35em;
        border-radius: 4px;
        overflow-wrap: anywhere;
      }
      a {
        color: var(--accent);
      }
      button {
        font: inherit;
        color: inherit;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px 16px 64px;
      }
      header h1 {
        font-size: 1.5rem;
        margin: 0 0 4px;
        letter-spacing: 0.01em;
      }
      header p {
        margin: 0;
        color: var(--muted);
        max-width: 72ch;
      }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 20px 0 16px;
      }
      .tab {
        min-height: 44px;
        padding: 8px 16px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        cursor: pointer;
      }
      .tab[aria-selected='true'] {
        background: var(--text);
        color: var(--bg);
        border-color: var(--text);
      }
      .intro {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 16px;
        margin-bottom: 16px;
      }
      .intro p {
        margin: 0;
        flex: 1 1 360px;
        color: var(--muted);
      }
      .play {
        min-height: 44px;
        padding: 8px 18px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 380px) minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }
      @media (max-width: 820px) {
        .grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .lane {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .hop {
        width: 100%;
        min-height: 44px;
        display: grid;
        grid-template-columns: 28px 1fr;
        gap: 10px;
        align-items: start;
        text-align: left;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-left: 5px solid var(--svc);
        border-radius: 8px;
        background: var(--surface);
        cursor: pointer;
        transition:
          opacity 0.2s,
          background 0.2s;
      }
      .hop .n {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        font-size: 0.85em;
        padding-top: 2px;
      }
      .hop .t {
        display: block;
        font-weight: 600;
        line-height: 1.45;
      }
      .hop .s {
        display: block;
        font-size: 0.8em;
        color: var(--muted);
      }
      .hop[aria-current='step'] {
        background: var(--surface-2);
        box-shadow: inset 0 0 0 1px var(--svc);
      }
      .hop.pulse {
        background: var(--surface-2);
      }
      .hop.failed {
        border-color: var(--danger);
        background: var(--danger-bg);
      }
      .hop.skipped {
        opacity: 0.35;
      }
      .hop .fx {
        display: inline-block;
        margin-left: 6px;
        font-size: 0.75em;
        color: var(--danger);
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        min-width: 0;
      }
      @media (min-width: 821px) {
        .panel {
          position: sticky;
          top: 16px;
          max-height: calc(100vh - 32px);
          overflow: auto;
        }
      }
      .panel h2 {
        margin: 0 0 4px;
        font-size: 1.2rem;
      }
      .panel h3 {
        margin: 20px 0 8px;
        font-size: 0.95rem;
      }
      .svc-chip {
        display: inline-block;
        font-size: 0.78em;
        padding: 1px 8px;
        border-radius: 999px;
        border: 1px solid var(--svc);
        color: var(--svc);
        margin-right: 4px;
      }
      .change {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--surface-2);
      }
      .change strong {
        display: block;
        font-size: 0.85em;
        color: var(--muted);
      }
      .fails {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .fail-btn {
        min-height: 44px;
        padding: 8px 12px;
        border: 1px solid var(--danger);
        border-radius: 8px;
        background: transparent;
        color: var(--danger);
        cursor: pointer;
        text-align: left;
      }
      .fail-btn[aria-pressed='true'] {
        background: var(--danger);
        color: var(--surface);
      }
      .outcome {
        margin: 12px 0 0;
        border: 1px solid var(--danger);
        border-radius: 10px;
        overflow: hidden;
      }
      .outcome div {
        display: grid;
        grid-template-columns: 7.5em 1fr;
        gap: 12px;
        padding: 10px 12px;
        border-top: 1px solid var(--border);
      }
      .outcome div:first-child {
        border-top: 0;
      }
      .outcome dt {
        font-weight: 600;
        color: var(--muted);
        font-size: 0.88em;
      }
      .outcome dd {
        margin: 0;
        min-width: 0;
      }
      @media (max-width: 480px) {
        .outcome div {
          grid-template-columns: 1fr;
          gap: 2px;
        }
      }
      .refs {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .refs li {
        overflow-wrap: anywhere;
      }
      .refs .why {
        color: var(--muted);
        font-size: 0.88em;
      }
      .unknown {
        margin-top: 12px;
        font-size: 0.88em;
        color: var(--muted);
        border-left: 3px solid var(--border);
        padding-left: 10px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 8px;
      }
      .card {
        min-height: 64px;
        text-align: left;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-top: 4px solid var(--svc);
        border-radius: 8px;
        background: var(--surface);
        cursor: pointer;
      }
      .card[aria-pressed='true'] {
        background: var(--surface-2);
        box-shadow: inset 0 0 0 1px var(--svc);
      }
      .card .t {
        display: block;
        font-weight: 600;
      }
      .card .s {
        display: block;
        font-size: 0.8em;
        color: var(--muted);
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        margin: 0 0 12px;
        font-size: 0.82em;
        color: var(--muted);
      }
      .legend span::before {
        content: '';
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 5px;
        background: var(--svc);
        vertical-align: -1px;
      }
      footer {
        margin-top: 40px;
        color: var(--muted);
        font-size: 0.85em;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
      @media (prefers-reduced-motion: reduce) {
        .hop {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Dayopt 経路ウォークスルー</h1>
        <p>
          操作を 1 つ選び、どの処理とサービスを通るかを辿る。各段で「ここで失敗させる」を押すと、画面・データ・再試行・痕跡がどうなり、どこから確認するかが出る。目的は暗記ではなく、変更の影響先と障害時の初手を自分で引けるようにすること。
        </p>
      </header>

      <div class="tabs" role="tablist" aria-label="操作例" id="tabs"></div>
      <div id="view"></div>

      <footer>
        <p>
          正本はコードと既存の運用文書。ここは入口にすぎない。リンクは GitHub の <code>main</code> を指す。記述がコードとずれていたら、この HTML の
          <code>walkthrough-data</code> を直す（<code>pnpm docs:check</code> が参照先の存在だけは検査する）。
        </p>
      </footer>
    </div>

    <script type="application/json" id="walkthrough-data">
      {
        "repo": "https://github.com/Dayopt/dayopt/blob/main/",
        "services": {
          "browser": { "label": "ブラウザ", "var": "--svc-browser" },
          "vercel": { "label": "Vercel（Next.js）", "var": "--svc-vercel" },
          "supabase": { "label": "Supabase", "var": "--svc-supabase" },
          "resend": { "label": "Resend", "var": "--svc-resend" },
          "github": { "label": "GitHub Actions", "var": "--svc-github" },
          "external": { "label": "その他の外部", "var": "--svc-external" }
        },
        "scenarios": [
          {
            "id": "save-plan",
            "title": "Plan を保存",
            "intro": "カレンダーで時間帯をドラッグし、作成パネルでアクティビティを選ぶ。選んだ瞬間に保存が走る。",
            "play": "▶ 保存を押す",
            "hops": [
              {
                "id": "destination",
                "svc": "browser",
                "title": "Plan か Record かを決める",
                "what": "終了時刻が今より未来なら Plan、過去なら Record が既定になる。過去の時間帯でだけ Plan へ切り替えられる。通信のない純粋な関数。",
                "change": "時刻の規則を強制しているのは DB trigger で、ここはその写し。ここだけ変えても保存できるかどうかは変わらない。規則を撤去・変更する時は invariants.md §時刻 の写し表を全部たどる。",
                "refs": [
                  { "path": "apps/product/src/features/timeblock/domain/timeblock-destination.ts", "find": "resolveTimeblockDestination" },
                  { "path": "apps/product/src/features/timeblock/domain/timeblock-destination.ts", "find": "resolveTimeblockKindChoice" },
                  { "path": "docs/engineering/invariants.md", "find": "### 規則の写しと、その分類", "why": "写しの一覧（契約変換 / UX 先回り）" }
                ],
                "fails": []
              },
              {
                "id": "inline-create",
                "svc": "browser",
                "title": "アクティビティを選ぶと作成を依頼する",
                "what": "作成パネルでアクティビティを選んだ瞬間に mutation を呼ぶ。送る前に、画面が持っているデータで重なりを先に確かめる（往復を減らすための写し）。成功すると「取り消し」付きのトーストを出し、取り消しは作ったものを削除する。",
                "change": "作成の入口はここと、サイドバーのアクティビティタップの 2 つ。手数を変える時は両方を見る。",
                "refs": [
                  { "path": "apps/product/src/features/calendar/components/create/useInlineCreate.ts", "find": "mutation.mutate(" },
                  { "path": "apps/product/src/features/calendar/components/create/InlineCreatePanel.tsx", "find": "InlineCreatePanel" }
                ],
                "fails": [
                  {
                    "id": "client-overlap",
                    "label": "画面上で重なりが見つかる",
                    "screen": "重なりのトーストが出て、作成しない。",
                    "data": "変化なし。サーバーへは何も送っていない。",
                    "retry": "なし。時間帯を変えて選び直す。",
                    "trace": "何も残らない（通信前）。",
                    "look": "仕様どおりの挙動。サーバー側の判定（DB の排他制約）と食い違うなら、写しがずれている。",
                    "refs": [{ "path": "apps/product/src/features/calendar/components/create/useInlineCreate.ts", "find": "errors.timeOverlap" }]
                  }
                ]
              },
              {
                "id": "optimistic",
                "svc": "browser",
                "title": "先に画面へ出す（楽観的更新）",
                "what": "サーバーの返事を待たず、一時 ID（temp-…）の Plan を一覧のキャッシュへ差し込む。その直前に一覧の snapshot を取っておき、失敗したらそこへ戻す。",
                "change": "キャッシュのキーや一覧の絞り込み条件を変えると、差し込み先と巻き戻し対象がずれる。書き込み mutation を足す時は optimistic-update skill の手順に従う。",
                "refs": [
                  { "path": "apps/product/src/features/timeblock/hooks/useTimeblockWriteMutations.ts", "find": "const createPlan = api.planCommands.create.useMutation" },
                  { "path": "apps/product/src/features/timeblock/hooks/useTimeblockWriteMutations.ts", "find": "snapshotTimeblockLists" },
                  { "path": "docs/engineering/architecture.md", "find": "### 楽観的更新のフロー" }
                ],
                "fails": [
                  {
                    "id": "offline",
                    "label": "ブラウザがオフライン",
                    "screen": "一時 ID の Plan が表示されたまま、応答待ちで止まる。",
                    "data": "サーバーへは何も届いていない。",
                    "retry": "失敗ではなく一時停止になる（TanStack Query の既定。mutation の networkMode は上書きしていない）。回線が戻ると自動で送り直す。ただし一時停止中の依頼は保存しない設定なので、その間にタブを閉じると消える。",
                    "trace": "何も残らない。",
                    "look": "DevTools の Network タブと navigator.onLine。ブラウザがオフラインと判定した時だけこの挙動で、回線が不安定なだけなら下の「通信が途中で切れる」になる。",
                    "refs": [
                      { "path": "apps/product/src/app/[locale]/(app)/_providers/_composition/ProvidersComposition.tsx", "find": "shouldDehydrateMutation: () => false" },
                      { "path": "apps/product/src/lib/trpc/query-client.ts", "find": "networkMode: 'offlineFirst'", "why": "query 側だけの設定。mutation には効かない" }
                    ]
                  }
                ]
              },
              {
                "id": "trpc-client",
                "svc": "browser",
                "title": "tRPC で /api/trpc へ送る",
                "what": "1 本の httpBatchLink で /api/trpc へ POST する（query も POST。入力を URL やログに残さないため）。送り直し用の link は無く、timeblock の mutation は retry: false。",
                "change": "link を足す・変える影響は全 API に及ぶ。エラーを受ける共通処理（401 で画面ごとログインへ移動、Sentry 送信）は QueryClient 側にある。",
                "refs": [
                  { "path": "apps/product/src/lib/trpc/browser-client.ts", "find": "httpBatchLink" },
                  { "path": "apps/product/src/features/timeblock/hooks/useTimeblockWriteMutations.ts", "find": "retry: false" },
                  { "path": "apps/product/src/lib/trpc/query-client.ts", "find": "function handleAuthError" }
                ],
                "fails": [
                  {
                    "id": "network-lost",
                    "label": "通信が途中で切れる",
                    "screen": "一時 ID の Plan が消え（snapshot へ戻す）、「保存に失敗」のトーストが出る。",
                    "data": "2 通りある。届く前に切れたなら DB は変わらない。DB で確定した後に返事だけ失われたなら、DB には Plan がある。",
                    "retry": "自動では送り直さない（retry: false）。代わりに成功・失敗どちらでも一覧を取り直す（onSettled）。後者なら取り直しで Plan が再び現れる。利用者がもう一度作ると二重になりうるのはこのケース。",
                    "trace": "サーバーの形をしていない通信エラーとして、ブラウザから Sentry へ送る（source: trpc_client_transport）。ブラウザの Sentry は分析の同意がある時だけ動くので、無いこともある。",
                    "look": "Sentry で source:trpc_client_transport を探し、同じ時刻の Vercel の /api/trpc ログで、サーバーまで届いていたかを見る。",
                    "refs": [
                      { "path": "apps/product/src/lib/trpc/client-errors.ts", "find": "trpc_client_transport" },
                      { "path": "apps/product/src/features/timeblock/hooks/useTimeblockWriteMutations.ts", "find": "onSettled: invalidate" },
                      { "path": "apps/product/instrumentation-client.ts", "find": "hasAnalyticsConsent" }
                    ]
                  },
                  {
                    "id": "session-expired",
                    "label": "セッションが切れている（401）",
                    "screen": "/auth/login へ画面ごと移動する（キャッシュも捨てるため、意図的にハードリロード）。",
                    "data": "変化なし。",
                    "retry": "しない。ログイン後に元のパスへ戻る。",
                    "trace": "想定内の拒否なので Sentry には出ない。",
                    "look": "頻発するなら Supabase Auth のログと、cookie を更新する middleware。",
                    "refs": [{ "path": "apps/product/src/lib/trpc/query-client.ts", "find": "function isAuthError" }]
                  }
                ]
              },
              {
                "id": "route",
                "svc": "vercel",
                "title": "/api/trpc で受ける",
                "what": "Vercel の Function（Node.js、上限 60 秒）。context を作って認証方式（session / oauth / service role）を判定し、認証前に IP 単位の rate limit を見る。",
                "change": "ここは全 tRPC 共通の入口。context に項目を足すと全 procedure の実行前コストが増える。",
                "refs": [
                  { "path": "apps/product/src/app/api/trpc/[trpc]/route.ts", "find": "createFetchTRPCContext" },
                  { "path": "apps/product/src/lib/trpc/context.ts", "find": "isPreAuthRateLimited" }
                ],
                "fails": [
                  {
                    "id": "ip-rate-limit",
                    "label": "IP 単位の rate limit を超える（429）",
                    "screen": "「保存に失敗」のトースト。一時 Plan は消える。",
                    "data": "変化なし。",
                    "retry": "しない。超過中に送り直すと同じ枠をさらに食い、復旧が遅れるだけなので。",
                    "trace": "想定内（TOO_MANY_REQUESTS）として Sentry には出さない。",
                    "look": "Upstash のダッシュボード。E2E が 429 に当たる時は手続きの数を数える。",
                    "refs": [
                      { "path": "apps/product/src/lib/trpc/query-client.ts", "find": "function isRateLimitedError" },
                      { "path": "apps/product/src/lib/trpc/errors.ts", "find": "'TOO_MANY_REQUESTS'" }
                    ]
                  },
                  {
                    "id": "function-down",

    <script>
      (function () {
        'use strict';
        var data = JSON.parse(document.getElementById('walkthrough-data').textContent);
        var tabsEl = document.getElementById('tabs');
        var viewEl = document.getElementById('view');
        var state = { tab: 0, hop: 0, fail: null, timer: null };
        var tabs = data.scenarios.concat([{ id: 'outages', title: data.outages.title }]);

        function el(tag, attrs, children) {
          var node = document.createElement(tag);
          Object.keys(attrs || {}).forEach(function (k) {
            if (k === 'text') node.textContent = attrs[k];
            else if (k === 'style') node.setAttribute('style', attrs[k]);
            else node.setAttribute(k, attrs[k]);
          });
          (children || []).forEach(function (c) {
            if (c) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
          });
          return node;
        }

        function svcStyle(svc) {
          var s = data.services[svc] || data.services.external;
          return '--svc: var(' + s.var + ')';
        }

        function svcChip(svc) {
          var s = data.services[svc] || data.services.external;
          return el('span', { class: 'svc-chip', style: svcStyle(svc), text: s.label });
        }

        function refList(refs) {
          if (!refs || refs.length === 0) return null;
          return el(
            'ul',
            { class: 'refs' },
            refs.map(function (r) {
              var href = data.repo + r.path.split('/').map(encodeURIComponent).join('/');
              return el('li', {}, [
                el('a', { href: href, target: '_blank', rel: 'noopener' }, [el('code', { text: r.path })]),
                ' ',
                el('span', { class: 'why', text: 'で ' }),
                el('code', { text: r.find }),
                el('span', { class: 'why', text: ' を探す' + (r.why ? '（' + r.why + '）' : '') }),
              ]);
            }),
          );
        }

        function renderTabs() {
          tabsEl.textContent = '';
          tabs.forEach(function (t, i) {
            var b = el('button', {
              class: 'tab',
              role: 'tab',
              id: 'tab-' + t.id,
              'aria-selected': String(i === state.tab),
              'aria-controls': 'view',
              tabindex: i === state.tab ? '0' : '-1',
              text: t.title,
            });
            b.addEventListener('click', function () {
              selectTab(i);
            });
            b.addEventListener('keydown', function (e) {
              if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
              var next = (i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length;
              selectTab(next);
              document.getElementById('tab-' + tabs[next].id).focus();
            });
            tabsEl.appendChild(b);
          });
          viewEl.setAttribute('role', 'tabpanel');
          viewEl.setAttribute('aria-labelledby', 'tab-' + tabs[state.tab].id);
        }

        function selectTab(i) {
          stopPlay();
          state.tab = i;
          state.hop = 0;
          state.fail = null;
          render();
        }

        function stopPlay() {
          if (state.timer) clearInterval(state.timer);
          state.timer = null;
        }

        function render() {
          renderTabs();
          if (tabs[state.tab].id === 'outages') renderOutages();
          else renderScenario(data.scenarios[state.tab]);
        }

        function legend(svcs) {
          return el(
            'div',
            { class: 'legend', 'aria-hidden': 'true' },
            svcs.map(function (s) {
              return el('span', { style: svcStyle(s), text: data.services[s].label });
            }),
          );
        }

        function renderScenario(sc) {
          viewEl.textContent = '';
          var failHop = -1;
          if (state.fail) {
            sc.hops.forEach(function (h, i) {
              if (h.id === state.fail.hop) failHop = i;
            });
          }

          var play = el('button', { class: 'play', type: 'button', text: sc.play });
          play.addEventListener('click', function () {
            startPlay(sc);
          });
          viewEl.appendChild(el('div', { class: 'intro' }, [el('p', { text: sc.intro }), play]));

          var used = [];
          sc.hops.forEach(function (h) {
            if (used.indexOf(h.svc) < 0) used.push(h.svc);
          });

          var lane = el('ol', { class: 'lane', 'aria-label': '通る処理' });
          sc.hops.forEach(function (h, i) {
            var cls = 'hop';
            if (failHop === i) cls += ' failed';
            else if (failHop >= 0 && i > failHop) cls += ' skipped';
            var btn = el(
              'button',
              { class: cls, type: 'button', style: svcStyle(h.svc), 'data-i': String(i) },
              [
                el('span', { class: 'n', text: String(i + 1).padStart(2, '0') }),
                el('span', {}, [
                  el('span', { class: 't' }, [
                    h.title,
                    h.fails.length ? el('span', { class: 'fx', text: '失敗 ' + h.fails.length }) : null,
                  ]),
                  el('span', { class: 's', text: data.services[h.svc].label }),
                ]),
              ],
            );
            if (i === state.hop) btn.setAttribute('aria-current', 'step');
            btn.addEventListener('click', function () {
              stopPlay();
              state.hop = i;
              if (state.fail && state.fail.hop !== h.id) state.fail = null;
              renderScenario(sc);
            });
            lane.appendChild(el('li', {}, [btn]));
          });

          var left = el('div', {}, [legend(used), lane]);
          var panel = el('section', { class: 'panel', 'aria-live': 'polite', id: 'panel' });
          fillHopPanel(panel, sc, sc.hops[state.hop]);
          viewEl.appendChild(el('div', { class: 'grid' }, [left, panel]));
        }

        function fillHopPanel(panel, sc, h) {
          panel.appendChild(el('div', {}, [svcChip(h.svc)]));
          panel.appendChild(el('h2', { text: h.title }));
          panel.appendChild(el('p', { text: h.what }));
          if (h.change) {
            panel.appendChild(
              el('div', { class: 'change' }, [el('strong', { text: 'ここを変えると' }), h.change]),
            );
          }

          if (h.fails.length) {
            panel.appendChild(el('h3', { text: 'ここで失敗させる' }));
            var row = el('div', { class: 'fails' });
            h.fails.forEach(function (f) {
              var on = !!(state.fail && state.fail.hop === h.id && state.fail.id === f.id);
              var b = el('button', {
                class: 'fail-btn',
                type: 'button',
                'aria-pressed': String(on),
                text: '⚡ ' + f.label,
              });
              b.addEventListener('click', function () {
                state.fail = on ? null : { hop: h.id, id: f.id };
                renderScenario(sc);
                var p = document.getElementById('panel');
                if (p && window.matchMedia('(max-width: 820px)').matches) p.scrollIntoView({ block: 'start' });
              });
              row.appendChild(b);
            });
            panel.appendChild(row);

            var active = null;
            if (state.fail && state.fail.hop === h.id) {
              h.fails.forEach(function (f) {
                if (f.id === state.fail.id) active = f;
              });
            }
            if (active) {
              var rows = [
                ['画面', active.screen],
                ['データ', active.data],
                ['再試行', active.retry],
                ['痕跡', active.trace],
                ['最初に見る', active.look],
              ];
              panel.appendChild(
                el(
                  'dl',
                  { class: 'outcome' },
                  rows.map(function (r) {
                    return el('div', {}, [el('dt', { text: r[0] }), el('dd', { text: r[1] })]);
                  }),
                ),
              );
              if (active.refs && active.refs.length) {
                panel.appendChild(el('h3', { text: 'この失敗の根拠' }));
                panel.appendChild(refList(active.refs));
              }
            }
          }

          panel.appendChild(el('h3', { text: 'コードと文書' }));
          panel.appendChild(refList(h.refs));
        }

        function startPlay(sc) {
          stopPlay();
          state.fail = null;
          state.hop = 0;
          renderScenario(sc);
          var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (reduce) return;
          state.timer = setInterval(function () {
            if (state.hop >= sc.hops.length - 1) {
              stopPlay();
              return;
            }
            state.hop += 1;
            renderScenario(sc);
          }, 900);
        }

        function renderOutages() {
          var o = data.outages;
          viewEl.textContent = '';
          viewEl.appendChild(el('div', { class: 'intro' }, [el('p', { text: o.intro })]));
          if (!state.outage) state.outage = o.items[0].id;
          var cards = el('div', { class: 'cards', role: 'group', 'aria-label': '外部サービス' });
          var current = o.items[0];
          o.items.forEach(function (it) {
            var on = it.id === state.outage;
            if (on) current = it;
            var b = el(
              'button',
              { class: 'card', type: 'button', style: svcStyle(it.svc), 'aria-pressed': String(on) },
              [el('span', { class: 't', text: it.name }), el('span', { class: 's', text: it.role })],
            );
            b.addEventListener('click', function () {
              state.outage = it.id;
              renderOutages();
            });
            cards.appendChild(b);
          });

          var panel = el('section', { class: 'panel', 'aria-live': 'polite' });
          panel.appendChild(el('h2', { text: current.name + ' が止まったら' }));
          panel.appendChild(el('p', { class: 'why', text: current.role }));
          var rows = [
            ['壊れる', current.breaks],
            ['動き続ける', current.keeps],
            ['コードの挙動', current.behavior],
            ['関係する env', current.env.length ? current.env.join(', ') : '（なし）'],
            ['最初に見る', current.look],
          ];
          panel.appendChild(
            el(
              'dl',
              { class: 'outcome' },
              rows.map(function (r) {
                return el('div', {}, [el('dt', { text: r[0] }), el('dd', { text: r[1] })]);
              }),
            ),
          );
          panel.appendChild(el('h3', { text: 'コードと文書' }));
          panel.appendChild(refList(current.refs));
          panel.appendChild(
            el('p', { class: 'unknown', text: 'env は名前だけを載せる。値は 1Password が正本（docs/operations/secrets.md）。' }),
          );
          viewEl.appendChild(el('div', { class: 'grid' }, [cards, panel]));
        }

        render();
      })();
    </script>
  </body>
</html>
