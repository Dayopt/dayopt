        - production-ops
      release_allowed_branch: main
      release_required_reviewers: none
      ruleset:
        strict_up_to_date: true
        resolve_threads: true
        bypass_actors: 0
      required_check_contract:
        - Static_Checks
        - Unit_Tests
        - Integration_Tests
        - Vercel_product
        - Vercel_web
      contracts:
        - release
        - operations
        - infrastructure
        - secrets
