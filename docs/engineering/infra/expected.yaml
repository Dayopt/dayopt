version: 1
scope:
  project: Dayopt
  repository_baseline: 650f62dc733831765aa8c110e29533b532e023f2
  mode: read_only
  purpose: Dayoptの重要なサービス設計を人とagentが見失わず、read-only doctorで日々の実態と観測状況を追う
  completion_criteria:
    - 重要な接続・環境分離・権限境界と正本参照が一覧になっている
    - 実測の差異と取得不能・手動確認が区別されている
  environments:
    - production
    - preview
    - integration
source_contracts:
  infrastructure:
    - docs/engineering/infra.md
    - docs/decisions.md
  secrets:
    - docs/operations/secrets.md
    - scripts/tasks/env/schema.ts
  vercel:
    - scripts/ci/production-config-audit.mjs
    - apps/product/vercel.json
    - apps/web/vercel.json
  release:
    - .github/workflows/promote.yml
    - scripts/ci/production-release.mjs
  operations:
    - .github/workflows/production-config-audit.yml
    - .github/workflows/nightly.yml
  auth:
    - scripts/ci/production-auth-config-audit.mjs
    - supabase/config.toml
  storage_rls:
    - scripts/ci/production-storage-rls-audit.mjs
  schema:
    - scripts/ci/production-schema-drift-audit.mjs
    - supabase/migrations
  cron:
    - apps/product/src/lib/ops/cron-heartbeat-policy.mjs
    - supabase/migrations
  mcp:
    - apps/product/src/lib/oauth-server
    - apps/product/production-build-gate.mjs
    - scripts/tasks/mcp-gate.ts
  calendar:
    - apps/product/src/features/external-calendar/server/authority-config.ts
  backup:
    - scripts/ci/storage-backup.sh
    - docs/operations/disaster-recovery-drill.md
  privacy:
    - packages/observability/src/posthog-browser.ts
    - apps/product/sentry.server.config.ts
  password_check:
    - apps/product/src/lib/auth/pwned-password.ts
  billing:
    - apps/product/src/features/settings/server/billing-mutation-service.ts
  telemetry:
    - apps/product/src/lib/analytics/DeferredAnalytics.tsx
    - apps/web/src/shell/privacy/BrowserTelemetry.tsx
  development_ai:
    - scripts/tasks/env/schema.ts
    - scripts/lib/jev-adapter.ts
  contact:
    - docs/operations/contact-email.md
  monitoring:
    - docs/operations/monitoring.md
  analytics:
    - docs/operations/product-analytics.md
    - docs/operations/posthog-analytics.md
services:
  github:
    purpose: repo・CI・review・Supabase/Vercel deployment の制御
    failure_impact: 開発と Production deploy の経路が止まる
    review_triggers:
      - repository/ruleset/App権限変更
      - workflow/release経路変更
    contract_refs:
      - infrastructure
      - release
      - operations
      - secrets
    expected:
      visibility_direction: private
      visibility_precondition: github_team
      visibility_transition: unknown
      environments:
        - production-release
        - production-ops
      release_allowed_branch: main
      release_required_reviewers: none
      ruleset:
        strict_up_to_date: true
        resolve_threads: true
        bypass_actors: 0
      required_check_contract:
        - Static_Checks
        - Unit_Tests
        - Integration_Tests
        - Vercel_product
        - Vercel_web
      contracts:
        - release
        - operations
        - infrastructure
        - secrets
    coverage:
      - hooks
      - secrets_api
      - ruleset_details
  vercel:
    purpose: Product/Web の配信・domain・環境ごとの接続設定
    failure_impact: アプリ/公開サイトの配信や Preview 分離が崩れる
    review_triggers:
      - project/domain/env変更
      - 配信revision更新
    contract_refs:
      - vercel
      - release
      - infrastructure
    expected:
      product_and_web:
        autoAssignCustomDomains: false
        functionDefaultTimeout: 60
        commandForIgnoringBuildStep: null
        affected_project_skip: disabled
        include_files_outside_root: true
      integration_target: existing_product_project_preview_target_fixed_branch_origin
      integration_contract_source: https://github.com/Dayopt/dayopt/issues/2910
      integration_migration_status: runtime_verification_pending
      data: synthetic_no_production_clone
      deployment_identity: live_domain_alias_and_served_sha
      contracts:
        - vercel
        - release
        - infrastructure
    coverage:
      - sensitive_env_values
      - project_settings
      - deployed_cron_heartbeat
  supabase:
    purpose: DB・Auth・Storage・schema/RLS・cron の保存と強制点
    failure_impact: 認証・ユーザーデータ・アクセス分離・定期処理へ影響する
    review_triggers:
      - project/branch/Auth変更
      - migration/Storage policy変更
    contract_refs:
      - auth
      - storage_rls
      - schema
      - cron
      - infrastructure
    expected:
      contracts:
        - auth
        - storage_rls
        - schema
        - cron
        - infrastructure
      auth_contract: AUTH_CONFIG_CONTRACT_safe_fields_plus_hook_endpoint
      auth_hook_endpoint: https://yvglwblxrnrenfifsnje.supabase.co/functions/v1/send-auth-email
      edge_function:
        name: send-auth-email
        verify_jwt: false
        authentication: hook_signature
      avatars:
        public: true
        max_bytes: 5242880
        mime:
          - image/jpeg
          - image/png
          - image/gif
          - image/webp
      rls: owner_isolation_and_required_policies
      schema: deployed_revision_migration_set
    coverage:
      - backups_api
      - google_selected_client
      - captcha_secret_match
      - storage_rls_and_schema_live
      - pg_cron_success
  mcp_oauth:
    purpose: MCP の issuer/resource/client と書込許可の契約
    failure_impact: MCP接続または書込の認可境界が崩れる
    review_triggers:
      - OAuth client/callback変更
      - write gate/Preview構成変更
    contract_refs:
      - mcp
      - secrets
    expected:
      production:
        issuer: https://app.dayopt.app
        resource: https://mcp.dayopt.app
      clients:
        claude_ai: https://claude.ai/api/mcp/auth_callback
        chatgpt: https://chatgpt.com/connector_platform_oauth_redirect
        cursor: cursor://anysphere.cursor-mcp/oauth/callback
      preview: exact_branch_origin_database_and_upstash_binding
      gates:
        - runtime_client_allowlist
        - database_mutation_control
        - billing_gate
        - maintenance_write_fence
      contracts:
        - mcp
    coverage:
      - client_registration
      - sensitive_upstash_binding
      - maintenance_write_fence
  stripe:
    purpose: Live/Test を分離した課金と削除時customer cleanup
    failure_impact: 課金・解約・Stripe利用者のアカウント削除へ影響する
    review_triggers:
      - Live有効化
      - price/webhook/Portal/API version変更
    contract_refs:
      - billing
      - secrets
    expected:
      production_activation_contract: apps/product/src/lib/ops/cron-heartbeat-policy.mjs#BILLING_RECONCILIATION_ACTIVATION
      integration: test_only
      portal_and_trial: source_contract_before_activation
      contract_ref: billing
    coverage:
      - portal_settings
      - webhook_secret_replica
      - billing_flow
  resend:
    purpose: Auth・Product・Web のメール送信とbounce/complaint抑止
    failure_impact: 認証メール/問い合わせ送信・不達/苦情の抑止記録へ影響する
    review_triggers:
      - domain/sender/webhook変更
      - 送信キー/署名キーrotation
    contract_refs:
      - contact
      - auth
      - secrets
    expected:
      separate_webhook_signatures: true
      auth_hook_and_contact_sender: explicit_verified_sender
      support_replies: dedicated_smtp_key
    coverage:
      - sender_replicas
      - edge_secret_replicas
      - support_smtp
  cloudflare:
    purpose: 権威DNS・Email Routing・Turnstile・R2 backup の境界
    failure_impact: 全domainの名前解決・問い合わせ受信・Bot対策・復旧へ影響する
    review_triggers:
      - DNS/転送先/CAPTCHA変更
      - registrar/R2権限/retention変更
    contract_refs:
      - infrastructure
      - contact
      - backup
      - secrets
    expected:
      authoritative_zone: dayopt.app
      backup_buckets:
        - avatars
        - attachments
      backup_retention_days: 35
      rclone_sync_default_max_delete: 1000
      turnstile:
        widget_strategy: shared_across_environments
        production_domains:
          - app.dayopt.app
          - dayopt.app
        server_secret_matches_site_key: true
    coverage:
      - zone_admin_settings
      - turnstile_domains
      - r2_locks
      - r2_permissions_and_retention
      - backup_restore_evidence
  posthog:
    purpose: 同意に基づくProduct/Web計測と削除契約
    failure_impact: 計測品質・プライバシー・データ削除へ影響する
    review_triggers:
      - 法務承認/計測有効化
      - project/key/consent/replay設定変更
    contract_refs:
      - analytics
      - privacy
      - telemetry
      - secrets
    expected:
      production_activation: legal_approval_pending
      consent: required
      autocapture: false
      session_replay: false
      person_profiles: identified_only
      event_property_filter: required
      deletion_credential_before_enable: true
    coverage:
      - project_settings
      - public_key_project_match
      - deletion_master_exists
      - deletion_flow
  sentry:
    purpose: Product/Webのエラー監視・PII除去・build source maps
    failure_impact: 障害の検知/調査に加えProduction buildが止まり得る
    review_triggers:
      - project/token/source-map/release変更
      - PII/組織設定変更
    contract_refs:
      - monitoring
      - privacy
      - secrets
    expected:
      send_default_pii: false
      pii_scrubbing: required
      project_visibility: private
      organization_requires_two_factor: true
      root_trace_sample_rate: 0.1
      source_maps_match_served_release: true
      auth_edge_reporting: optional
    coverage:
      - project_settings
      - organization_settings
      - project_environments
      - service_hooks
      - source_map_application
  google:
    purpose: 環境を分離したAuthログイン・Calendar OAuth
    failure_impact: Googleログイン・外部Calendar連携へ影響する
    review_triggers:
      - Cloud project/client/callback変更
      - consent/test users/refresh-token鍵変更
    contract_refs:
      - auth
      - calendar
      - secrets
    expected:
      calendar_authority_contract: calendar
      environment_separation_contract: docs/operations/secrets.md#google-oauth-の本番非本番分離
      auth_callbacks:
        production: https://yvglwblxrnrenfifsnje.supabase.co/auth/v1/callback
        nonproduction: https://tilwaprottpyhlfoggbb.supabase.co/auth/v1/callback
      calendar_callbacks:
        production: https://app.dayopt.app/api/integrations/google-calendar/callback
        integration: https://product-git-integration-dayopt.vercel.app/api/integrations/google-calendar/callback
    coverage:
      - registered_callbacks
      - consent_screen_and_test_users
      - project_number_and_refresh_token_key_replicas
  upstash:
    purpose: rate limitとwebhookの冪等処理、非本番の隔離
    failure_impact: operational起動・OAuth/MCP制限・webhook処理へ影響する
    review_triggers:
      - Redis接続先/token権限変更
      - Preview/Integrationの利用方針変更
    contract_refs:
      - infrastructure
      - mcp
      - secrets
    expected:
      preview_binding: isolated_nonproduction
    coverage:
      - product_sensitive_url
      - token_permissions
  pwned_passwords:
    purpose: SHA-1先頭5文字だけを使う漏洩パスワード検査
    failure_impact: 漏洩パスワード検出が失われる。停止時は検査を通す契約
    review_triggers:
      - provider/timeout/fail-open契約変更
    contract_refs:
      - password_check
    expected:
      origin: https://api.pwnedpasswords.com
      authentication: none
      payload: sha1_prefix_5_characters
      timeout_ms: 3000
      failure: continue_without_check
    coverage:
      - live_availability
  optional:
    purpose: Jev/AI Gatewayなど任意の開発支援
    failure_impact: 開発支援と利用予算へ影響する
    review_triggers:
      - project/key/budget/provider変更
    contract_refs:
      - development_ai
      - secrets
    expected: {}
    coverage: []
  uptimerobot:
    purpose: 公開healthの外形監視と通知
    failure_impact: 障害の検知や通知先への到達が失われる
    review_triggers:
      - monitor target/status変更
      - 通知先変更
    contract_refs:
      - monitoring
    expected: {}
    coverage:
      - notification_routes
  telemetry:
    purpose: 同意と環境境界に従うVercel Analytics/Speed Insights
    failure_impact: 計測品質・プライバシーへ影響する
    review_triggers:
      - Dashboard有効化
      - 同意/環境/build revision変更
    contract_refs:
      - telemetry
      - analytics
    expected:
      products:
        - product
        - web
      providers:
        - analytics
        - speed_insights
      production_only: true
      consent: required
      contract_ref: telemetry
    coverage:
      - dashboard_enablement_and_ingestion
  support_smtp:
    purpose: support受信とGmailからの専用Resend SMTP返信
    failure_impact: 問い合わせの受信・返信が失われる
    review_triggers:
      - Email Routing転送先変更
      - Gmail Send mail as/専用SMTP key変更
    contract_refs:
      - contact
      - secrets
    expected:
      receiving: Cloudflare Email Routing to the human-managed Gmail destination
      replying: Gmail Send mail as via dedicated Resend SMTP key
      contract_ref: contact
    coverage:
      - receiving_destination
      - gmail_sender_and_smtp_replica
  onepassword:
    purpose: secretの正本・注入・人間のアカウント復旧手段
    failure_impact: 資格情報rotation・replica同期元・account recoveryが失われる
    review_triggers:
      - item移動/名称変更/rotation
      - Vault/Service Account権限/復旧担当変更
    contract_refs:
      - secrets
      - infrastructure
    expected:
      master: 1Password
      replicas:
        - Vercel
        - GitHub Actions
        - Supabase Edge/Auth
      agent_boundary: agent vault read-only; inaccessible human and ci items stay unverified
      human_locator: Vault and exact item name; optional human bookmark
    coverage:
      - human_item_locations_and_confirmation
      - service_account_vault_scope
      - replica_match_and_recovery
