# Release と同じ local Supabase / production build で Calendar の取得・操作を配備前に検証する。
# 外部環境・provider secrets・Production Release workflow は使用しない。
name: Calendar Navigation E2E

on:
  pull_request:
    branches: [main, integration]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/calendar-navigation-e2e.yml'
      - '.github/actions/setup/**'
      - 'apps/product/**'
      - 'packages/**'
      - 'supabase/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'

permissions:
  contents: read

concurrency:
  group: calendar-navigation-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Calendar Navigation E2E
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium chromium-headless-shell

      - id: supabase-version
        run: |
          version=$(node -p "require('./package.json').devDependencies.supabase")
          if [ "$version" = "undefined" ] || [ -z "$version" ]; then
            echo "::error::supabase CLI version の抽出に失敗しました（root package.json の devDependencies.supabase を確認してください）: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ steps.supabase-version.outputs.version }}

      - name: Start Supabase
        run: supabase start

      - name: Get Supabase status
        id: supabase
        run: |
          API_URL=$(supabase status --output json | jq -r '.API_URL')
          ANON_KEY=$(supabase status --output json | jq -er '.PUBLISHABLE_KEY // .ANON_KEY | select(type == "string" and length > 0)')
          SERVICE_ROLE_KEY=$(supabase status --output json | jq -er '.SECRET_KEY // .SERVICE_ROLE_KEY | select(type == "string" and length > 0)')
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "anon_key=$ANON_KEY" >> $GITHUB_OUTPUT
          echo "service_role_key=$SERVICE_ROLE_KEY" >> $GITHUB_OUTPUT

      - name: Run E2E tests
        id: e2e
        # initial-load: SSR hydration と browser の範囲再取得ゼロ。
        # critical-path: 作成・reload と procedure 予算26。navigation: 既存の予算28。
        # block-search: 表示データの検索操作と予算48（#2678）。
        # Mobile Chrome は既存 @mobile の初回URL・検索ケースだけを収集する。
        run: >-
          pnpm --dir apps/product exec playwright test
          --config=playwright.isolated.config.ts
          '/calendar-initial-load\.spec\.ts$' '/critical-path\.spec\.ts$'
          '/calendar-navigation\.spec\.ts$' '/block-search\.spec\.ts$'
          --project="chromium" --project="Mobile Chrome"
          --reporter=line,json --output="$RUNNER_TEMP/product-isolated-e2e"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase.outputs.anon_key }}
          SUPABASE_SECRET_KEY: ${{ steps.supabase.outputs.service_role_key }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_STRIPE_PRO_PRICE_ID: price_e2e_dummy
          # next start runs in production mode and validates this key at request time.
          # This disposable local-Supabase lane uses no production recovery codes.
          RECOVERY_CODE_PEPPER: test-e2e-only-local-recovery-code-pepper
          CI: '1'
          POSTHOG_SERVER_ENABLED: 'false'
          NEXT_PUBLIC_POSTHOG_PROJECT_KEY: ''
          E2E_PREVIEW_CLOUD_INTENT: '0'
          E2E_ALLOW_NONLOCAL_SUPABASE: '0'
          E2E_ISOLATED_ARTIFACT_DIR: ${{ runner.temp }}/product-isolated-e2e
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/product-isolated-e2e-results.json
          # service role suite が env の欠落で丸ごと skip されても「0 failed」で緑に
          # なるのを防ぐ（skip ではなく即 fail させる）。
          E2E_REQUIRE_SERVICE_ROLE_SUITES: '1'

      - name: Stop Supabase
        if: always()
        run: supabase stop

      # retry-pass（初回失敗 → retry で成功）を「最終的に緑」に埋もれさせない（#2743）。
      # retry-pass では落とさず、Step Summary と warning 注釈で見せる。
      - name: Report E2E retries
        if: always()
        env:
          E2E_TEST_OUTCOME: ${{ steps.e2e.outcome }}
        run: node scripts/ci/e2e-retry-report.mjs "$RUNNER_TEMP/product-isolated-e2e-results.json" --label product --file-prefix apps/product/src/lib/test/e2e/

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: product-isolated-e2e
          path: |
            ${{ runner.temp }}/product-isolated-e2e/
            ${{ runner.temp }}/product-isolated-e2e-results.json
          retention-days: 7

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: screenshots
          path: ${{ runner.temp }}/product-isolated-e2e/
          retention-days: 7
