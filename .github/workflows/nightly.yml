name: Nightly

# CI ファイル統合（#2483 Phase 1）: 旧 heavy-post-merge.yml / integration.yml
# （integration job のみ。migration-safety は ci.yml の unit job へ移設済み）/
# replica-check.yml / storage-backup-export.yml の cron を 1 ファイルへ統合し、
# status:* ラベルの close-time 剥がし漏れを掃除する batch sweep を新設 job として
# 追加した（統合時に同居していた night-watch job は 2026-09-02 に撤去済み）。
#
# **同じ schedule 配列に複数 cron を書くと、どの cron でもこの workflow 全体が
# 起動する。job 単位の `if: github.event.schedule == '<cron>'` 振り分けが
# 無いと、全 job が全 cron で走り分が爆発する。** 全 job に振り分け条件が
# あることを変更時に必ず確認すること。
#
# concurrency は job 単位で設定する（旧ファイルごとに group 名・
# cancel-in-progress が異なっていたため。特に storage-backup-export は
# 転送中キャンセルで destination が中途半端な状態になるのを避けるため
# cancel-in-progress: false を維持する必要がある。workflow 全体を 1 つの
# concurrency group にすると、無関係な cron 同士が互いをキャンセルしてしまう）。
#
# **層 3（E2E / Web Build & E2E）と integration は 2026-09-03 にこのファイルから
# 撤去した。** 層 3 は promote.yml へ移設し（merge 連動 promote。影響のある suite
# だけを promote の前段で走らせる）、integration は per-PR の ci.yml へ一本化した
# （branch:finish の up-to-date gate により merge commit の tree = per-PR で検証済み
# の tree になるため、nightly の再実行は同じ tree を 2 度検証していた）。これに伴い
# 「promote.yml が job 表示名を check-run 名として参照する」結合も解消している。

on:
  schedule:
    # 04:30 JST — status:* ラベルの batch sweep（close 時の剥がし漏れ backstop）。
    - cron: '30 19 * * *'
    # 06:30 JST — replica-check（production-config-audit の 06:00 JST cron と
    # 同日、時間をずらして外部 API 呼び出し衝突を避ける）。
    - cron: '30 21 * * *'
    # 07:00 JST — storage-backup-export。
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      jobs:
        description: '実行する job を選ぶ。replica-check / status-label-sweep / storage-backup は各 job を単独で手動代行したい時に選ぶ（既定は replica-check）。all は一括検証専用——storage-backup-export の実転送・status label sweep も同時に走るため、単独の job だけ再実行したい時に選ばないこと（内製クロスレビュー risk-reviewer 指摘、P2、PR #2484: jobs=all しか無いと、単独 job の手動代行のつもりで実データ転送を誤爆させうる）'
        type: choice
        options:
          - replica-check
          - status-label-sweep
          - storage-backup
          - all
        default: replica-check
      dry_run:
        description: 'storage-backup-export 用（jobs=storage-backup または all の時のみ意味を持つ）: true にすると実際には転送・削除せず rclone --dry-run で予定操作だけ表示する'
        type: boolean
        default: false

jobs:
  # ─── status:* ラベルの batch sweep（新設）────────────────────────────
  # #2483 で issue-status-label-cleanup.yml（issue close webhook 起点の
  # per-close 即時剥がし）を廃止し、この nightly 一括 sweep が**唯一の経路**
  # になった（旧「per-close イベントの backstop」という位置づけは正しくない
  # ——close イベントを直接 trigger にする workflow はもう存在しない）。残留は
  # 最長 1 日だが、queue 検索は `is:open` 付きが通常のため実害は無い（#2483
  # issue 本文で確定済みのトレードオフ）。scripts/ci/strip-status-labels.mjs の
  # bulk サブコマンドは #2440 の初期実装から既に存在する（KNOWN_STATUS_LABELS
  # の全 closed issue を走査して重複除去する設計）。
  status-label-sweep:
    name: status:* ラベルの batch sweep
    if: github.event.schedule == '30 19 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.jobs == 'status-label-sweep' || github.event.inputs.jobs == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: nightly-status-label-sweep
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --budget-seconds は上の timeout-minutes より短くする。予算に達した時点で
      # script 側が次の 1 件を始めずに打ち切り、残件と再開コマンドを Step Summary
      # へ残して exit 0 する（#2506）。余白が要るのは、予算ちょうどにすると最後の
      # 1 件の処理中に job timeout の SIGKILL が来て打ち切り報告ごと消えるため。
      # timeout-minutes を変える時はこの値も一緒に見直すこと。
      - name: status:* ラベルの batch sweep を実行
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/strip-status-labels.mjs bulk --execute --budget-seconds 480

  # ─── replica-check（旧 replica-check.yml）───────────────────────────
  replica-check:
    name: Check Vercel replica against 1Password ledger
    if: github.event.schedule == '30 21 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.jobs == 'replica-check' || github.event.inputs.jobs == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: nightly-replica-check
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Run replica check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: pnpm replica:check

  # ─── storage-backup-export（旧 storage-backup-export.yml）───────────
  # Supabase Storage（avatars / attachments）を rclone で Cloudflare R2 へ搬出する。
  # destination 側を source に合わせる設計（scripts/ci/storage-backup.sh 冒頭
  # コメント参照）。secrets 未投入の間は明示 failure にする（fail closed）。
  storage-backup-export:
    name: Export Supabase Storage to R2
    if: github.event.schedule == '0 22 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.jobs == 'storage-backup' || github.event.inputs.jobs == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: nightly-storage-backup-export
      # sync 実行中のキャンセルは destination を中途半端な状態で残しうるため
      # cancel-in-progress にしない。
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: rclone をインストール
        env:
          BACKUP_RCLONE_VERSION: '1.75.0'
          BACKUP_RCLONE_ZIP_SHA256: 'aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa'
        run: |
          curl -fsSLO "https://downloads.rclone.org/v${BACKUP_RCLONE_VERSION}/rclone-v${BACKUP_RCLONE_VERSION}-linux-amd64.zip"
          echo "${BACKUP_RCLONE_ZIP_SHA256}  rclone-v${BACKUP_RCLONE_VERSION}-linux-amd64.zip" | sha256sum -c -
          unzip -q "rclone-v${BACKUP_RCLONE_VERSION}-linux-amd64.zip"
          sudo install -m 0755 "rclone-v${BACKUP_RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version

      - name: 必須 secrets の存在を確認（fail closed）
        env:
          RCLONE_CONFIG_SOURCE_TYPE: ${{ secrets.RCLONE_CONFIG_SOURCE_TYPE }}
          RCLONE_CONFIG_SOURCE_PROVIDER: ${{ secrets.RCLONE_CONFIG_SOURCE_PROVIDER }}
          RCLONE_CONFIG_SOURCE_ENDPOINT: ${{ secrets.RCLONE_CONFIG_SOURCE_ENDPOINT }}
          RCLONE_CONFIG_SOURCE_REGION: ${{ secrets.RCLONE_CONFIG_SOURCE_REGION }}
          RCLONE_CONFIG_SOURCE_ACCESS_KEY_ID: ${{ secrets.RCLONE_CONFIG_SOURCE_ACCESS_KEY_ID }}
          RCLONE_CONFIG_SOURCE_SECRET_ACCESS_KEY: ${{ secrets.RCLONE_CONFIG_SOURCE_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_DEST_TYPE: ${{ secrets.RCLONE_CONFIG_DEST_TYPE }}
          RCLONE_CONFIG_DEST_PROVIDER: ${{ secrets.RCLONE_CONFIG_DEST_PROVIDER }}
          RCLONE_CONFIG_DEST_ENDPOINT: ${{ secrets.RCLONE_CONFIG_DEST_ENDPOINT }}
          RCLONE_CONFIG_DEST_REGION: ${{ secrets.RCLONE_CONFIG_DEST_REGION }}
          RCLONE_CONFIG_DEST_ACCESS_KEY_ID: ${{ secrets.RCLONE_CONFIG_DEST_ACCESS_KEY_ID }}
          RCLONE_CONFIG_DEST_SECRET_ACCESS_KEY: ${{ secrets.RCLONE_CONFIG_DEST_SECRET_ACCESS_KEY }}
        run: |
          missing=()
          for key in \
            RCLONE_CONFIG_SOURCE_TYPE RCLONE_CONFIG_SOURCE_PROVIDER RCLONE_CONFIG_SOURCE_ENDPOINT \
            RCLONE_CONFIG_SOURCE_REGION RCLONE_CONFIG_SOURCE_ACCESS_KEY_ID RCLONE_CONFIG_SOURCE_SECRET_ACCESS_KEY \
            RCLONE_CONFIG_DEST_TYPE RCLONE_CONFIG_DEST_PROVIDER RCLONE_CONFIG_DEST_ENDPOINT \
            RCLONE_CONFIG_DEST_REGION RCLONE_CONFIG_DEST_ACCESS_KEY_ID RCLONE_CONFIG_DEST_SECRET_ACCESS_KEY; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::未設定の GitHub Secrets があります: ${missing[*]}"
            echo "::error::docs/operations/secrets.md の Change Procedure に従って登録してください（#2026）。"
            exit 1
          fi
          echo "必須 secrets はすべて設定されています。"

      - name: storage-backup.sh を実行
        env:
          RCLONE_CONFIG_SOURCE_TYPE: ${{ secrets.RCLONE_CONFIG_SOURCE_TYPE }}
          RCLONE_CONFIG_SOURCE_PROVIDER: ${{ secrets.RCLONE_CONFIG_SOURCE_PROVIDER }}
          RCLONE_CONFIG_SOURCE_ENDPOINT: ${{ secrets.RCLONE_CONFIG_SOURCE_ENDPOINT }}
          RCLONE_CONFIG_SOURCE_REGION: ${{ secrets.RCLONE_CONFIG_SOURCE_REGION }}
          RCLONE_CONFIG_SOURCE_ACCESS_KEY_ID: ${{ secrets.RCLONE_CONFIG_SOURCE_ACCESS_KEY_ID }}
          RCLONE_CONFIG_SOURCE_SECRET_ACCESS_KEY: ${{ secrets.RCLONE_CONFIG_SOURCE_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_DEST_TYPE: ${{ secrets.RCLONE_CONFIG_DEST_TYPE }}
          RCLONE_CONFIG_DEST_PROVIDER: ${{ secrets.RCLONE_CONFIG_DEST_PROVIDER }}
          RCLONE_CONFIG_DEST_ENDPOINT: ${{ secrets.RCLONE_CONFIG_DEST_ENDPOINT }}
          RCLONE_CONFIG_DEST_REGION: ${{ secrets.RCLONE_CONFIG_DEST_REGION }}
          RCLONE_CONFIG_DEST_ACCESS_KEY_ID: ${{ secrets.RCLONE_CONFIG_DEST_ACCESS_KEY_ID }}
          RCLONE_CONFIG_DEST_SECRET_ACCESS_KEY: ${{ secrets.RCLONE_CONFIG_DEST_SECRET_ACCESS_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: bash scripts/ci/storage-backup.sh

  # ─── nightly の失敗を issue にする ────────────────────────────────────
  # 3 job とも失敗しても issue も commit status も出ず、schedule 起動の既定メールだけ
  # だった（2026-09-08 Production Reality Audit。2026-08-31 / 09-01 の失敗 run は誰にも
  # 届かず、ログは GitHub の保持期限で既に取得不能）。特に storage-backup-export は
  # DR で唯一「演習済み」の復元経路（#2026）の搬出元なので、静かな停止は復元元が
  # 古くなることを意味する。promote.yml notify_failure と同じ title-prefix 方式。
  # skipped（cron 振り分けで走らない job）は失敗ではない。
  notify-failure:
    name: File nightly failure
    needs: [status-label-sweep, replica-check, storage-backup-export]
    if: >-
      ${{ !cancelled()
          && ( needs.status-label-sweep.result == 'failure'
               || needs.replica-check.result == 'failure'
               || needs.storage-backup-export.result == 'failure' ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SWEEP_RESULT: ${{ needs.status-label-sweep.result }}
          REPLICA_RESULT: ${{ needs.replica-check.result }}
          BACKUP_RESULT: ${{ needs.storage-backup-export.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          title_prefix="[auto] Nightly job が失敗しました"
          hints=""
          if [ "$BACKUP_RESULT" = "failure" ]; then
            hints="$hints
          - **storage-backup-export**: Supabase Storage → Cloudflare R2 の日次搬出が止まっている。**連続すると DR の復元元（\`docs/operations/disaster-recovery-drill.md\` §Storage）が古くなる。** secrets 未投入なら run log の \`未設定の GitHub Secrets\` を見る。rclone の失敗なら \`scripts/ci/storage-backup.sh\` の \`--max-delete\` 上限（暫定 1000）に当たっていないか確認する"
          fi
          if [ "$REPLICA_RESULT" = "failure" ]; then
            hints="$hints
          - **replica-check**: Vercel production env と 1Password 台帳（\`scripts/tasks/env/schema.ts\`）の不一致。\`pnpm replica:check\` を手元で再現し、\`docs/operations/secrets.md\` に従って同期する"
          fi
          if [ "$SWEEP_RESULT" = "failure" ]; then
            hints="$hints
          - **status-label-sweep**: \`scripts/ci/strip-status-labels.mjs bulk\` の失敗。実害は closed issue に \`status:*\` が残るだけ（queue 検索は \`is:open\` 付きが通常）。翌日の cron で再試行される"
          fi
          body="nightly の job が失敗した（起動: \`$EVENT_NAME\`）。

          | job | result |
          | --- | --- |
          | status:* ラベルの batch sweep | \`$SWEEP_RESULT\` |
          | Check Vercel replica against 1Password ledger | \`$REPLICA_RESULT\` |
          | Export Supabase Storage to R2 | \`$BACKUP_RESULT\` |

          run: $RUN_URL
          $hints

          直したら **この issue は手で close する**（自動で閉じる経路は無い）。同じ title prefix の open issue があれば追記するので、失敗が続いても issue は増えない。

          このコメントは \`nightly.yml\` の \`notify-failure\` job による自動起票/追記。"

          existing=$(TITLE_PREFIX="$title_prefix" gh issue list --repo "$GITHUB_REPOSITORY" \
            --label "area:operations" --state open --json number,title \
            --jq '[.[] | select(.title | startswith(env.TITLE_PREFIX))][0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title_prefix" \
              --label "area:operations,priority:p2" \
              --body "$body"
          fi
