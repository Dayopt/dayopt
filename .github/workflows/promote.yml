name: Production Release

# main へ merge しても Production domain は即座には切り替わらない。
# Auto-assign Custom Production Domains を無効化した Product / Web に対し、
# この workflow だけが「影響のある層 3 が green・同一 SHA・両 project 成功」を
# 確認して promote する。タグと GitHub Release は promote と観察が終わった後の
# 証跡であり、deploy trigger ではない。
#
# 2026-08-20（#2268）: push:main を廃止し手動 dispatch のみにした。
# 2026-09-03: **merge 連動の自動 promote へ戻した**。ただし #2268 以前の
# 「merge したら即 promote」ではなく、`impact →（影響のある層 3）→ release` の
# 3 段にして、層 3 が green の時だけ promote する。手動 dispatch は break-glass
# （force）と drill 専用に残る。
#
# 層 3（E2E / Web Build & E2E）は nightly.yml からこの workflow へ移設した。
# #2382 が per-merge の層 3 を廃止した根拠は「promote が手動だから赤い main は
# ユーザーへ届かない」で、merge 連動にするとその前提が反転するため。影響のある
# suite だけを走らせることで per-merge のコストを抑える（判定は
# scripts/ci/release-impact.mjs、基準は各 project の live production SHA）。
#
# **層 3 の gate は check-run 名の文字列照合ではなく `needs.*.result`** で行う。
# 旧実装は nightly.yml の job 表示名を promote.yml 側の literal と一致させる
# 必要があり、改名で fail closed に止まる結合を持っていた。同一 workflow 内の
# needs にしたことでその class ごと消えている。
#
# kill switch: Actions 画面でこの workflow を Disable する（変数も revert も不要）。

on:
  # main への merge が promote を起動する。paths filter は付けない —— docs のみの
  # merge でも release job まで到達させ、`unaffected` の success status を発行する
  # 必要がある（create-release.yml の tag gate がこの status を要求する）。
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Break-glass Force Promote: skip layer 3, smoke, and Production Config Audit'
        type: boolean
        default: false
      reason:
        description: 'Required when force is enabled. Recorded in the commit status.'
        required: false
      simulate_failure:
        description: 'Drill only: smoke:<p> | promote:<p> | production-smoke:<p> (p = web | product)'
        required: false

# statuses: write は release job にだけ置く（層 3 job へ commit status 発行権限を
# 配らない）。
permissions:
  contents: read

# **workflow レベルの concurrency は置かない。** 層 3 を内包した状態で workflow 全体
# を 1 group へ直列化すると、GitHub は group ごとに pending を 1 本しか保持せず新着
# で古い pending を cancel するため、burst（実測 1 時間に 1〜3 merge）の 2 本目が
# promote されないまま黙って消える。直列化が要るのは promote そのものだけなので、
# release job の job レベル concurrency で行う。

jobs:
  # ─── どの層 3 を走らせるかを決める（pnpm install 不要の軽量 job）───────────
  impact:
    name: "\U0001F9ED Release Impact"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      product_affected: ${{ steps.run.outputs.product_affected }}
      web_affected: ${{ steps.run.outputs.web_affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 判定は「各 project が今配信している SHA → target SHA」の git diff で行う。
          # 既定の shallow clone では過去の production SHA が checkout に無く、判定が
          # 毎回 fail closed（= 常に両 project affected）へ落ちる。
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # pnpm install は行わない。release-impact.mjs と production-release.mjs は
      # node 標準ライブラリしか使わない（ci.yml の impact job と同じ判断）。
      - name: Resolve release impact
        id: run
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # GitHub keeps the existing VERCEL_ORG_ID replica; the runtime contract
          # uses the canonical 1Password/schema name VERCEL_TEAM_ID.
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_ORG_ID }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/ci/release-impact.mjs

  # ─── 層 3（CI 4 層再設計 #2269。2026-09-03 に nightly.yml から移設）──────────
  #
  # **job id にハイフンを使わない。** GitHub の式では `needs.web-e2e` が減算として
  # 解析され、release job の gate が黙って壊れる。
  #
  # concurrency group は job ごとに分ける。**2 job を同じ group に入れてはいけない**
  # —— job レベルの group は同一 run 内の job 同士にも効くため、
  # cancel-in-progress: true だと e2e と web が互いをキャンセルする。
  # 新しい push が古い run の同種 job をキャンセルする挙動は、group を
  # `<suite>-${{ github.ref }}` にすれば個別に成立する。キャンセルされた job は
  # `needs.<id>.result == 'cancelled'` になり、release job の gate が不成立になる
  # （= その run は promote しない。次の push の run が live 基準で拾い直す）。
  e2e:
    name: "\U0001F3AD E2E Tests"
    needs: impact
    if: ${{ needs.impact.outputs.product_affected == 'true' && github.event.inputs.force != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: promote-layer3-e2e-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium chromium-headless-shell

      - id: supabase-version
        run: |
          version=$(node -p "require('./package.json').devDependencies.supabase")
          if [ "$version" = "undefined" ] || [ -z "$version" ]; then
            echo "::error::supabase CLI version の抽出に失敗しました（root package.json の devDependencies.supabase を確認してください）: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: ${{ steps.supabase-version.outputs.version }}

      - name: Start Supabase
        run: supabase start

      - name: Get Supabase status
        id: supabase
        run: |
          API_URL=$(supabase status --output json | jq -r '.API_URL')
          ANON_KEY=$(supabase status --output json | jq -er '.PUBLISHABLE_KEY // .ANON_KEY | select(type == "string" and length > 0)')
          SERVICE_ROLE_KEY=$(supabase status --output json | jq -er '.SECRET_KEY // .SERVICE_ROLE_KEY | select(type == "string" and length > 0)')
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "anon_key=$ANON_KEY" >> $GITHUB_OUTPUT
          echo "service_role_key=$SERVICE_ROLE_KEY" >> $GITHUB_OUTPUT

      - name: Run E2E tests
        run: pnpm --dir apps/product exec playwright test --project="chromium"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase.outputs.anon_key }}
          SUPABASE_SECRET_KEY: ${{ steps.supabase.outputs.service_role_key }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_STRIPE_PRO_PRICE_ID: price_e2e_dummy
          # service role suite が env の欠落で丸ごと skip されても「0 failed」で緑に
          # なるのを防ぐ（skip ではなく即 fail させる）。
          E2E_REQUIRE_SERVICE_ROLE_SUITES: '1'

      - name: Stop Supabase
        if: always()
        run: supabase stop

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: apps/product/playwright-report/
          retention-days: 7

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: screenshots
          path: apps/product/test-results/
          retention-days: 7

  web:
    name: "\U0001F310 Web Build & E2E"
    needs: impact
    if: ${{ needs.impact.outputs.web_affected == 'true' && github.event.inputs.force != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: promote-layer3-web-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.0
        with:
          path: apps/web/.next/cache
          key: nextjs-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**/*.{ts,tsx}', 'apps/web/content/**/*.{md,mdx,json}') }}
          restore-keys: nextjs-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build web
        run: pnpm build:web

      - name: Install Playwright browser
        run: pnpm --filter @dayopt/web exec playwright install --with-deps chromium chromium-headless-shell

      - name: Run web E2E tests
        run: pnpm --filter @dayopt/web test:e2e:smoke

      - name: Upload web report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: web-playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload web test results on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: web-test-results
          path: apps/web/test-results/
          retention-days: 7

  # ─── 失敗の可視化 ───────────────────────────────────────────────────────
  #
  # promote の失敗は今まで **push した本人への失敗メールと commit status だけ**で、
  # 気づかれないまま「merge しても production へ出ない」状態が続いた（2026-09-07 に
  # 3 run 連続。#2643）。層 3 が赤いと release job ごと skip されるため、release の
  # step では拾えない —— 独立 job にして needs の result を見る。
  #
  # **この job は checkout しない。** repo の code を実行する job に書き込み token を
  # 置かない（ci.yml の同じ原則）。gh は runner に同梱されている。
  #
  # release job より前に置いてあるのは読み順の都合ではなく、
  # scripts/ci/release-workflow-contract.test.ts が release job を「宣言の開始から
  # ファイル末尾まで」で切り出しているため。後ろに足すとその契約検査の対象がこの job
  # まで広がる。実行順は needs が決めるので位置は影響しない。
  #
  # drill: `workflow_dispatch` の `simulate_failure`（例 `promote:product`）で release を
  # 意図的に落とせば、起票までを本番の経路で確認できる。専用 input は増やさない。
  notify_failure:
    name: File promote failure
    needs: [impact, e2e, web, release]
    # `superseded` は異常ではない。burst merge で後発 run が先に promote すると先発は
    # superseded で exit 1 するが、その commit の内容は既に production に入っている。
    # result だけを見ると正常な追い越しを P1 として起票し、runbook Playbook 2（rollback
    # 調査）へ誘導してしまう。
    if: >-
      ${{ !cancelled()
          && ( needs.impact.result == 'failure'
               || needs.e2e.result == 'failure'
               || needs.web.result == 'failure'
               || ( needs.release.result == 'failure'
                    && needs.release.outputs.release_status != 'superseded' ) ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # 失敗のたびに新規 issue を乱造しない。既存の未クローズ自動起票 issue があれば
      # コメントで追記する（title prefix で判定し、dedupe 専用ラベルは増やさない）。
      - name: File or update promote failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMPACT_RESULT: ${{ needs.impact.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          WEB_RESULT: ${{ needs.web.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          set -euo pipefail
          title_prefix="[auto] Production Release が失敗しました"
          body="production への promote が失敗した。**この commit は production へ出ていない**（現行 production は直前の正常な deployment のまま応答している）。

          | job | result |
          | --- | --- |
          | Release Impact | \`$IMPACT_RESULT\` |
          | E2E Tests | \`$E2E_RESULT\` |
          | Web Build & E2E | \`$WEB_RESULT\` |
          | Promote Production | \`$RELEASE_RESULT\` |

          対象 SHA: \`$SHA\`
          run: $RUN_URL

          直し方は \`docs/operations/runbook.md\` の Playbook 2。**「Re-run failed jobs」は使わない** —— 成功済みの impact job が再実行されず outputs が再利用されるため、古い判定のまま同じ失敗を繰り返す。修正を main へ merge すれば自動で再実行される。main HEAD をそのまま再試行するなら \`gh workflow run promote.yml --ref main\`。

          このコメントは \`promote.yml\` の \`notify_failure\` job による自動起票/追記。"

          existing=$(TITLE_PREFIX="$title_prefix" gh issue list --repo "$GITHUB_REPOSITORY" \
            --label "area:deployment" --state open --json number,title \
            --jq '[.[] | select(.title | startswith(env.TITLE_PREFIX))][0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title_prefix" \
              --label "area:deployment,priority:p1" \
              --body "$body"
          fi

  # ─── promote 本体（層 4）────────────────────────────────────────────────
  release:
    name: Promote Production
    needs: [impact, e2e, web]
    # **「suite を免除してよいのは impact が明示的に false と言った時だけ」**を
    # 肯定形で書く。`!= 'true'` 形にすると **空文字が免除側に落ちる**: impact job の
    # `outputs:` キー名 / step の `id:` / `impactKey` のどれか 1 つを改名すると、
    # `needs.impact.outputs.*` は空文字になり、層 3 の `if`（`== 'true'`）も偽で
    # 両 suite が skip され、gate も免除と読んで **層 3 ゼロで promote する**。
    # 旧実装（check-run 名の照合）で名前がずれた時の最悪は「promote が止まる」
    # だったので、`!= 'true'` は安全側を反転させてしまう。`== 'false'` なら空文字は
    # 免除にならず、skip された suite の result（`skipped`）で不成立になる。
    #
    # cancelled / failure / skipped / 空文字はいずれも `== 'success'` に一致しない
    # ので不成立（fail closed）。とくに job レベル concurrency で層 3 が cancel された
    # 場合、式関数の `cancelled()` は **run 全体**の cancel しか見ないため false の
    # ままだが、`needs.<id>.result == 'cancelled'` は正しく不成立になる。
    #
    # `!cancelled()` が要る: これが無いと暗黙の `success()` が付き、needs に skipped
    # が 1 つでもあるだけで release ごと skip される（unaffected な merge が
    # 永久に promote されなくなる）。`always()` は使わない —— run 全体が cancel
    # された時にまで promote を走らせない。
    #
    # **force は `needs.impact.result` の外側に置く。** break-glass が要るのは
    # impact job（フル clone + Vercel API）自体が壊れている時でもあるため、
    # impact の成功を前提にすると最後の手段が使えない。
    if: >-
      ${{ !cancelled()
          && ( github.event.inputs.force == 'true'
               || ( needs.impact.result == 'success'
                    && (needs.impact.outputs.product_affected == 'false' || needs.e2e.result == 'success')
                    && (needs.impact.outputs.web_affected == 'false' || needs.web.result == 'success') ) ) }}
    runs-on: ubuntu-latest
    # この environment には deployment branch policy（main のみ）が設定済みで、
    # main 以外の ref からの dispatch は job 開始前に GitHub 側で拒否される
    # （2026-09-01 実測: custom branch policies、許可は main のみ、required
    # reviewers なし）。**required reviewers を付けると自動 promote が承認待ちで
    # timeout する**ので、付ける場合はこの workflow の設計ごと見直すこと。
    environment: production-release
    # promote だけを直列化する。実行中の release は中断しない —— 中断すると片方
    # だけ promote された状態が残りうる。
    concurrency:
      group: production-release
      cancel-in-progress: false
    # `superseded`（より新しい deployment が既に live で、target の内容は production に
    # 入っている状態）でも合否判定の step は exit 1 する。notify_failure から本物の失敗と
    # 区別するために状態そのものを出す。
    outputs:
      release_status: ${{ steps.release.outputs.release_status }}
    permissions:
      contents: read
      statuses: write
    # scripts/ci/production-release.mjs の WORST_CASE_RELEASE_MS を必ず上回ること。
    # 下回ると rollback の途中で job が kill され、片方だけ promote された
    # production が手動 rollback の手掛かりごと失われる。
    # scripts/ci/release-workflow-contract.test.ts が不等式を守る。
    timeout-minutes: 80
    steps:
      # 実行する script は常にこの run の ref（push なら main、dispatch なら
      # dispatch した ref）のもの。release 対象は常に `github.sha` で、呼び出し側が
      # 任意の SHA を指定する口は持たない（`sha` input は 2026-09-03 に廃止した。
      # 層 3 を run 内で走らせる設計では checkout と異なる SHA は検証不能で、
      # 「未検証 × 全 project promote」の組み合わせしか作れないため。古い SHA を
      # 本番へ戻すのは promote ではなく rollback で、Vercel Instant Rollback
      # / runbook Playbook 2 が正しい経路）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 影響判定は「各 project が今配信している SHA → target SHA」の git diff で
          # 行う。既定の shallow clone では過去の production SHA が checkout に無く、
          # 判定が毎回 fail closed（= 常に両 project affected）へ落ちる。
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Require a reason for Force Promote
        if: inputs.force
        env:
          REASON: ${{ inputs.reason }}
        run: |
          if [ -z "$REASON" ]; then
            echo "::error::Force Promote requires a reason. Record it here and in the ops log."
            exit 1
          fi

      - name: Resolve and validate release SHA
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$GITHUB_SHA"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release target must be a 40 character commit SHA"
            exit 1
          fi

          # 常に main 包含を確認する。push:main の run では自明だが、
          # workflow_dispatch は任意 ref から起動でき、その場合 github.sha は
          # dispatch した ref の tip（main 以外）になりうる。environment の
          # deployment branch policy と二重防御にする。
          #
          # `main` という名の tag との曖昧さを避けるため heads/main で明示する。
          # 404 なら gh が非 0 終了し、代入が set -e に拾われて fail closed になる
          # （`export status=$(...)` にすると壊れるので前置しない）。
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/heads/main...$sha" --jq '.status')
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "::error::Release target must already be merged into main (compare status: $status)"
            exit 1
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Wait, smoke, and promote Production
        id: release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # GitHub keeps the existing VERCEL_ORG_ID replica; the runtime contract
          # uses the canonical 1Password/schema name VERCEL_TEAM_ID.
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_ORG_ID }}
          # Deployment Protection guards candidate unique URLs, so smoke needs
          # each project's Protection Bypass for Automation secret.
          VERCEL_BYPASS_PRODUCT: ${{ secrets.VERCEL_AUTOMATION_BYPASS_PRODUCT }}
          VERCEL_BYPASS_WEB: ${{ secrets.VERCEL_AUTOMATION_BYPASS_WEB }}
          RELEASE_SHA: ${{ steps.target.outputs.sha }}
          RELEASE_FORCE: ${{ inputs.force }}
          # impact job（T0）の判定を release（T1）へ渡す（#2574）。この 2 つは **別時刻の
          # live production SHA** を基準に独立して判定するため食い違いうる。live が前進する
          # だけなら T1 の affected は T0 の subset で安全側だが、Vercel Instant Rollback で
          # live が後退すると T1 だけが affected になり、層 3 を走らせていない project を
          # promote できてしまう。gate 式（この job の `if:`）は T0 しか見ないのでそこでは
          # 止まらないため、script 側で「promote 対象 ⊆ ここで 'true' と渡された project」を
          # 強制する。
          #
          # **既定値を書かないこと。** `|| 'true'` のような丸めを入れると、この配線が 1 行
          # 落ちただけで層 3 ゼロの promote が通る（対策そのものが無効になる）。空文字は
          # script 側で「未検証」として fail closed に扱われる。
          RELEASE_IMPACT_WEB_AFFECTED: ${{ needs.impact.outputs.web_affected }}
          RELEASE_IMPACT_PRODUCT_AFFECTED: ${{ needs.impact.outputs.product_affected }}
          # 2026-08-05 に段階適用が完了（両 project の Auto-assign Custom Production
          # Domains を無効化。#1817 の project 設定監査が「'' のまま放置され、live が
          # true に固定されていた」未完了状態を検出したのを受けて実施）。'false' 宣言
          # により release は run 開始時点の値ではなく false を expected として掃く。
          RELEASE_EXPECT_AUTO_ASSIGN: 'false'
          RELEASE_SIMULATE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure || '' }}
          # project ごとに live SHA が分かれうるため、「この run の後どこが何を配信
          # しているか」を artifact に残す。部分失敗の復旧で一次情報になる。
          RELEASE_MANIFEST_PATH: release-manifest.json
        run: |
          set +e
          node scripts/ci/production-release.mjs
          release_exit=$?
          set -e
          echo "exit_code=$release_exit" >> "$GITHUB_OUTPUT"

      # SHA が解決できていない場合は publish しない。空の SHA へ POST すると
      # 404 で step が落ちるだけで、何の情報も残らない。
      - name: Publish Production Release status
        if: always() && steps.target.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EXIT: ${{ steps.release.outputs.exit_code || '1' }}
          RELEASE_STATUS: ${{ steps.release.outputs.release_status || 'failed' }}
          RELEASE_SHA: ${{ steps.target.outputs.sha }}
          FORCED: ${{ inputs.force }}
          REASON: ${{ inputs.reason }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing to publish status for an invalid commit SHA"
            exit 1
          fi

          if [ "$RELEASE_EXIT" != "0" ]; then
            state=failure
            description="Release gate stopped before or during promote; see the run summary"
            if [ "$FORCED" = "true" ]; then
              description="Force Promote failed: $REASON"
            fi
          elif [ "$RELEASE_STATUS" = "superseded" ]; then
            # promote は 1 件も行われていない。この commit は live ではないので
            # success を出すと create-release.yml の gate を素通りしてしまう。
            state=failure
            description="Superseded: a newer deployment already serves Production"
          elif [ "$RELEASE_STATUS" = "unaffected" ]; then
            # どの app の build 入力も変わらない merge（docs / CI 設定など）。
            # Production の artifact はこの commit と等価なので tag を許可する。
            state=success
            description="No app impact; Production already serves an equivalent build"
          else
            state=success
            description="Production serves this commit"
            if [ "$FORCED" = "true" ]; then
              description="Force Promote: $REASON"
            fi
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$RELEASE_SHA" \
            -f state="$state" \
            -f context="Production Release" \
            -f description="${description:0:140}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null

      - name: Upload release manifest
        if: always()
        # **status publish の後に置く。** script の最終検証と status publish の間に
        # step を挟むと、その間の外部 promote を誰も見ないまま success が出る。
        # また診断用 artifact であって gate ではないので、失敗が status と食い違わない
        # よう non-gating にする（script 側の書き込み失敗を握るのと同じ扱い）。
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # run attempt ごとに分ける。re-run（同一 run 内の再試行）は同名 artifact を
          # 2 度 upload できず失敗するため、re-run 時に手動 rollback の一次情報である
          # manifest が 1 つも残らない事故を防ぐ。
          name: release-manifest-${{ github.run_attempt }}
          path: release-manifest.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Enforce release result
        if: always()
        env:
          RELEASE_EXIT: ${{ steps.release.outputs.exit_code || '1' }}
          RELEASE_STATUS: ${{ steps.release.outputs.release_status || 'failed' }}
        run: |
          if [ "$RELEASE_EXIT" != "0" ]; then
            exit "$RELEASE_EXIT"
          fi
          if [ "$RELEASE_STATUS" = "superseded" ]; then
            echo "::error::Target SHA is not live; a newer Production deployment already serves Production."
            exit 1
          fi
          exit 0
