name: Production Config Audit

# この audit が見るのは Vercel 側の状態（env 構成の drift）であって PR の diff では
# ない。**PR ごとの実行は contract 変更 PR だけに絞る**（2026-09-03、#2571）。
#
# この workflow が PR で見ていたのは 2 つあった:
#   (a) live な Vercel env drift —— PR の diff とは無関係。同じ live 状態を 1 日
#       30〜42 回観測していた（実測: 2026-09-01〜09-03 の 2.1 日で 85 run。Actions の
#       単一項目として repo 最大）
#   (b) audit contract 4 path の変更検出 —— 下の `Detect audit contract changes` step が
#       `changed=true` なら設計として必ず failure にし、trusted dispatch を強制する
#       （PR code に contract 変更を自己検証させないため）
#
# `paths` は (b) を**完全に維持したまま**（contract PR では従来どおり `synchronize` ごとに
# 発火する）、(a) の PR ごと実行だけを落とす。`types` は変えない。
#
# **(a) を落として安全な根拠**:
#   - 本当に守りたいのは「drift したまま production へ promote しない」ことで、それは
#     promote 側が見ている（`production-release.mjs` が `runProductionConfigAudit` を呼ぶ）。
#     main へ merge する時点の drift は出荷を止めないので、検出遅延 1 日で足りる
#   - backstop は日次 cron（06:00 JST）と下の push:main。dashboard の手動変更もそこで拾う
#   - merge は deadlock しない。Free plan の private repo では ruleset / branch protection が
#     使えず（`gh api .../rulesets` は 403）、唯一の gate である `finish-branch.sh` は
#     **失敗数と pending 数を数えるだけ**で check run の「存在」を要求しない。run が無ければ
#     rollup に entry が出ないだけで通る
#   - 2026-08-05 の `ci.yml` paths-ignore 撤去（PR #1836）の再演にはならない。あの事故の原因は
#     `paths` 単体ではなく「ruleset が required にした check が永久に expected で残る」ことで、
#     ruleset を使えない今は同じ経路が成立しない。**将来 Pro へ上げて ruleset を使う時は、
#     `Production Config Audit` を required にしないこと**（PR で publish されるのは
#     contract 変更 PR だけなので blanket な required check に使えない）
#   - contract ファイルを別 path へ動かして `paths` をすり抜ける経路は、
#     `scripts/__tests__/protected-path-gate-contract.test.ts` が
#     「各 glob が tracked file に 1 件以上一致する」ことを CI で毎回検査するので先に落ちる
#
# **`paths` だけに checkpoint を委ねない。** workflow が起動しない条件は `paths` の
# 意味論だけではなく、次のクラスを含む。いずれも「PR code に contract 変更を自己検証
# させない」という設計を静かに無効化する:
#
#   - Actions を一時 Disable している間（incident 対応で実際に行う運用がある）
#   - base branch の workflow 定義が壊れている / 消えている（`pull_request_target` は
#     **base 側の定義**で評価されるので、PR 側を直しても効かない）
#   - `paths` の書き間違いで対象を取りこぼす
#   - GitHub の `paths` 仕様（changed files が 3,000 件を超え、一致するファイルが先頭
#     3,000 件に無いと起動しない）
#
# そこで `finish-branch.sh` が **workflow の起動有無と独立に**、contract を変えた PR へ
# commit status `Production Config Audit` の success（= trusted dispatch 実行済み）を
# 要求する（`protected-path-gate.mjs` の `auditContract`）。**変更ファイル一覧そのものを
# 取得できなかった時も要求する**（contract 変更を否定できないため fail closed）。
# なお最後の 3,000 件のクラスでは、その一覧取得も同じ理由で失敗するため
# `auditContract` は判定不能になる —— そこを通すか止めるかが分岐点で、止める側に倒してある。
#
# `paths` のリストは `PRODUCTION_CONFIG_AUDIT_CONTRACT_PATHS`
# （`scripts/ci/protected-path-gate.mjs`）および下の grep 正規表現と同じ 4 path。
# 3 箇所の drift は `protected-path-gate-contract.test.ts` が固定する。
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/ci/production-config-audit.mjs'
      - 'apps/product/production-build-gate.mjs'
      - 'apps/web/production-build-gate.mjs'
      - '.github/workflows/production-config-audit.yml'
  # **push:main は「監査対象そのものを変える merge」だけに絞る**（2026-09-03）。
  #
  # env metadata の drift は、promote する merge では promote 側でも見る
  # （`production-release.mjs` が `runProductionConfigAudit` を呼ぶ）。ただし
  # **完全な代替ではない**: 呼ばれるのは `!force && alreadyServing.length > 0` の時
  # だけで（docs のみの merge では audit も smoke も走らない）、`checkProjectSettings:
  # false` なので project 設定監査（rootDirectory / autoAssignCustomDomains 等）は
  # 含まれず、`--deploy-health` と incident 起票は promote 経路に無い。
  # つまりこの filter で「per-merge 検出 → 最大 1 日以内の検出」へ落ちる。**その
  # backstop が日次 cron（06:00 JST）** で、dashboard の手動変更による drift も
  # そこで拾う。auto-assign の drift だけは promote 側の `sweepSettings()` が
  # unaffected な merge でも毎回掃くので per-merge のまま。
  #
  # auth-config / storage-rls は **Supabase production** を見ており、migration は
  # Supabase の GitHub 連携で main merge 時に適用されるので、`supabase/**` を含む
  # merge では引き続き直後に走らせる。audit script / build gate / この workflow
  # 自身を変える merge も、変更した当の監査を一度も走らせずに通さないため含める。
  #
  # `workflow_dispatch` は残す（`finish-branch.sh` の trusted-dispatch 免除経路は
  # PR head SHA への status 発行に依存しており、paths filter の影響を受けない）。
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/ci/production-config-audit.mjs'
      - 'scripts/ci/production-auth-config-audit.mjs'
      - 'scripts/ci/production-storage-rls-audit.mjs'
      - 'apps/product/production-build-gate.mjs'
      - 'apps/web/production-build-gate.mjs'
      - '.github/workflows/production-config-audit.yml'
  schedule:
    # 06:00 JST。merge が無い日でも dashboard 手動変更の drift を 1 日以内に検出する
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: production-config-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit Vercel metadata (trusted)
    # draft の間は走らせない。skip は conclusion: skipped の check run になり、
    # finish-branch.sh の畳み込みが「判定を持つ entry を優先」で処理する（ci.yml の重量 job と同型）。
    if: github.event_name != 'pull_request_target' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target must execute only the trusted base revision, never PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Detect audit contract changes
        id: contract
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Check both sides of a rename so a protected contract cannot evade
          # the trusted-head checkpoint by moving to a new path.
          #
          # production-auth-config-audit.mjs is deliberately NOT protected here: it
          # never runs in a PR or dispatch context (see the auth-config job), so a PR
          # editing it cannot produce a misleading green from a base-revision run.
          # Forcing a trusted dispatch for it would add friction without verification,
          # because the dispatch skips that job by design.
          changed_files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')
          if printf '%s\n' "$changed_files" | grep -Eq '^(scripts/ci/production-config-audit\.mjs|apps/product/production-build-gate\.mjs|apps/web/production-build-gate\.mjs|\.github/workflows/production-config-audit\.yml)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit Vercel environment metadata
        id: audit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # GitHub keeps the existing VERCEL_ORG_ID replica; the runtime contract
          # uses the canonical 1Password/schema name VERCEL_TEAM_ID.
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set +e
          node scripts/ci/production-config-audit.mjs
          audit_exit=$?
          set -e
          echo "exit_code=$audit_exit" >> "$GITHUB_OUTPUT"

      - name: Publish Production Config Audit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code || '1' }}
          CONTRACT_CHANGED: ${{ steps.contract.outputs.changed || 'false' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$CONTRACT_CHANGED" = "true" ]; then
            state=failure
            description="Audit contract changed; trusted head audit is required"
          elif [ "$AUDIT_EXIT" = "0" ]; then
            state=success
            description="Vercel metadata matches the Production contract"
          else
            state=failure
            description="Vercel metadata does not match the Production contract"
          fi

          shas=()
          if [ -n "$PR_NUMBER" ]; then
            head_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
            merge_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.merge_commit_sha // empty')
            shas+=("$head_sha")
            if [ -n "$merge_sha" ] && [ "$merge_sha" != "$head_sha" ]; then
              shas+=("$merge_sha")
            fi
          else
            shas+=("$GITHUB_SHA")
          fi

          for sha in "${shas[@]}"; do
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Refusing to publish status for an invalid commit SHA"
              exit 1
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
              -f state="$state" \
              -f context="Production Config Audit" \
              -f description="$description" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              >/dev/null
          done

      - name: Enforce audit result
        if: always()
        env:
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code || '1' }}
          CONTRACT_CHANGED: ${{ steps.contract.outputs.changed || 'false' }}
        run: |
          if [ "$CONTRACT_CHANGED" = "true" ]; then
            exit 1
          fi
          exit "$AUDIT_EXIT"

  # production デプロイの成否そのものを検知する経路が repo に無かった（#2121, #2124）。
  # PR の「Vercel – product」check は preview デプロイの結果、上の audit job は env
  # metadata の drift のみ、UptimeRobot は稼働中の（古い）デプロイの healthy 状態しか
  # 見ないため、いずれも「新しい deploy が失敗して古いデプロイのまま止まっている」ことを
  # 区別できなかった（2026-08-14〜17、3〜4 日間気づかれず main の merge が production に
  # 未反映のまま停滞した実績あり）。auth-config job と同じ理由（push:main / 日次 cron の
  # みで足り、PR の merge gate には巻き込まない）で分離する。
  #
  # **順序注意**: このジョブは auth-config より前に置く。
  # scripts/__tests__/production-auth-config-audit-contract.test.ts の
  # 「auth audit の結果は commit status を経由しない」は auth-config job 名（コロン込み）の出現位置から
  # ファイル末尾までを切り出して `statuses/` を含まないことを検証する。deploy-health を
  # auth-config の後ろに置くと、commit status を発行するこの job の内容がその検証範囲に
  # 巻き込まれ、無関係な contract test が壊れる（2026-08-17、PR #2130 で実際に発生）。
  deploy-health:
    name: Check production deploy health (trusted)
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # commit status / issue 本文の参照用（health 判定そのものには使わない。
      # scripts/ci/production-config-audit.mjs の evaluateProductionDeploymentHealth の
      # コメント参照: ignoreCommand による意図的スキップと区別できないため main HEAD
      # SHA との一致は判定条件にしない）。
      - name: Determine main HEAD SHA
        id: main_head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check production deployment health
        id: deploy_health
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set +e
          node scripts/ci/production-config-audit.mjs --deploy-health
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Publish Production Deploy Health status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.deploy_health.outputs.exit_code || '1' }}
          SHA: ${{ steps.main_head.outputs.sha }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing to publish status for an invalid commit SHA"
            exit 1
          fi

          if [ "$EXIT_CODE" = "0" ]; then
            state=success
            description="Latest production deployment is READY"
          else
            state=failure
            description="Latest production deployment is unhealthy (see run log)"
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context="Production Deploy Health" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null

      # 失敗のたびに新規 issue を乱造しない。既存の未クローズ自動起票 issue があれば
      # コメントで追記するだけにする（title prefix で判定、dedupe 用の専用ラベルは
      # 増やさず既存の area:deployment で絞り込む）。
      - name: File or update incident issue on unhealthy production deployment
        if: always() && steps.deploy_health.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.main_head.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title_prefix="[auto] production デプロイが unhealthy です"
          body="production target の最新デプロイが READY ではありません（ERROR / grace period 超過の BUILDING 停滞のいずれか）。検知時点の main HEAD: \`$SHA\`。詳細ログ: $RUN_URL

          このコメントは \`production-config-audit.yml\` の \`deploy-health\` job による自動起票/追記です。詳細: \`docs/operations/log/2026-08-17-incident-production-deploy-freeze.md\`"

          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "area:deployment" --state open --json number,title \
            --jq --arg prefix "$title_prefix" '[.[] | select(.title | startswith($prefix))][0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title_prefix" \
              --label "area:deployment,area:operations,priority:p1" \
              --body "$body"
          fi

      - name: Enforce deploy health result
        if: always()
        env:
          EXIT_CODE: ${{ steps.deploy_health.outputs.exit_code || '1' }}
        run: exit "$EXIT_CODE"

  # Supabase Auth の enforcement 値の drift 検出（#1926）。Vercel の audit と分けて
  # いる理由は 2 つ。
  #
  # 1. **token を branch code へ渡さない。** Supabase Management API の PAT は account
  #    単位 read-write で、Vercel token（deploy / env metadata）より blast radius が広い。
  #    上の job は `pull_request_target`（base.sha を checkout）に加えて
  #    `workflow_dispatch --ref <branch>`（**branch head を checkout**）でも走り、後者は
  #    trusted dispatch の運用上ほぼ毎回使われる。PAT をそこへ乗せない。
  # 2. **merge gate を巻き込まない。** commit status「Production Config Audit」は
  #    finish-branch.sh が解除判定に使う。auth 設定の drift は PR の diff と無関係
  #    （Dashboard 由来）なので、これを status に載せると無関係な全 PR の merge が止まる。
  #
  # 検出経路は push:main（merge 直後）と日次 cron。失敗は workflow failure として
  # 通知される。手元での単発確認は `op run` 経由の CLI 実行
  # （`docs/operations/security/environment-secrets.md` §Supabase Auth config）。
  #
  # **このジョブより後に commit status を発行する job を置かない。**
  # scripts/__tests__/production-auth-config-audit-contract.test.ts の
  # 「auth audit の結果は commit status を経由しない」は auth-config job 名（コロン込み）の出現位置から
  # ファイル末尾までを切り出して `statuses/` を含まないことを検証する（上の deploy-health job 参照）。
  # auth-config 以降に job を追加してよい条件は「commit status を発行しない」であって
  # 「ファイル末尾に置く」ではない —— 実際 storage-rls job（#2323）は auth-config の後に
  # 続くが、commit status は発行しないため上記 contract test は変わらず green のまま。
  auth-config:
    name: Audit Supabase Auth config (trusted)
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # secret 名は `SUPABASE_ACCESS_TOKEN` と分ける。同名だと、別 workflow が
      # 「その名前の secret を参照するだけ」で PR code の実行経路へ token が配られる
      # （integration.yml がまさにその形の env を持っていた）。名前を分けておけば、
      # audit 用 token の配布先はこの step だけに閉じる。
      #
      # 出力の grep は positive proof。CLI guard が何らかの理由で発火しないと
      # 「何も実行せず exit 0」になり、audit が静かに死ぬ。
      - name: Audit Supabase Auth enforcement values
        env:
          SUPABASE_AUTH_AUDIT_TOKEN: ${{ secrets.SUPABASE_AUTH_AUDIT_TOKEN }}
        run: |
          set -o pipefail
          node scripts/ci/production-auth-config-audit.mjs | tee audit-output.txt
          grep -q 'Production Auth Config Audit passed' audit-output.txt

  # production の storage.objects RLS drift の継続検出（#2323）。`pnpm rls:snapshot:check`
  # は migration から構築した ephemeral な local DB しか見ないため、production だけに
  # 残存した legacy policy（#2316 の root cause）はこれまで検出できなかった。
  #
  # auth-config job と同じ理由（token を branch code へ渡さない・merge gate を巻き込ま
  # ない）で分離する。発火経路も同じ push:main（merge 直後）と日次 cron のみ。
  #
  # **SUPABASE_STORAGE_RLS_AUDIT_TOKEN は 2026-08-25（#2345）に発行・GitHub Secret 登録
  # 済み。** 発行前は token 未設定を `::notice::` + exit 0 で許容していたが、発行済みに
  # なった今その分岐を残すと「token が後日失効・削除されても audit が黙って no-op の
  # 緑になる」false-green 経路になる（#2449 で発見。#2323 が守ろうとした「production だけ
  # に残存する drift を見逃さない」という主題そのものへの逆行）。auth-config job
  # （scripts/ci/production-auth-config-audit.mjs）と同じ「token 未設定は即 throw」へ揃え、
  # 曖昧な中間状態を持たない。
  storage-rls:
    name: Audit production storage.objects RLS (trusted)
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Audit production storage.objects RLS
        env:
          SUPABASE_STORAGE_RLS_AUDIT_TOKEN: ${{ secrets.SUPABASE_STORAGE_RLS_AUDIT_TOKEN }}
        run: |
          set -o pipefail
          node scripts/ci/production-storage-rls-audit.mjs | tee storage-rls-audit-output.txt
          grep -q 'Production Storage RLS Audit passed' storage-rls-audit-output.txt

  # ─── Supabase 側 audit の失敗を issue にする ─────────────────────────────
  # auth-config / storage-rls は commit status も issue も出さず、失敗は workflow の
  # 赤色と schedule 起動の既定メールだけだった（2026-09-08 Production Reality Audit）。
  # Supabase Auth の Dashboard drift や production の storage.objects RLS drift は
  # Actions タブを開く人がいなければ気づかない。deploy-health / promote.yml
  # notify_failure と同じ title-prefix 方式で 1 本の issue に集約する。
  #
  # **監査 job 自体には触れない。** Supabase PAT を持つ job の permissions は
  # `contents: read` のままにし、起票は別 job で行う（token を branch code へ渡さない
  # 設計と、「auth-config 以降の job は commit status を発行しない」契約 test を保つ。
  # この job は `gh issue` しか呼ばず、checkout も置かない）。
  notify-supabase-audit-failure:
    name: File Supabase audit failure
    needs: [auth-config, storage-rls]
    if: >-
      ${{ !cancelled()
          && ( needs.auth-config.result == 'failure'
               || needs.storage-rls.result == 'failure' ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update Supabase audit failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUTH_RESULT: ${{ needs.auth-config.result }}
          STORAGE_RESULT: ${{ needs.storage-rls.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          title_prefix="[auto] Production Supabase audit が失敗しました"
          hints=""
          if [ "$AUTH_RESULT" = "failure" ]; then
            hints="$hints
          - **Auth config**: Supabase Dashboard 側の drift の可能性。\`scripts/ci/production-auth-config-audit.mjs\` の \`AUTH_CONFIG_CONTRACT\` と実値を突き合わせる（値は run log に出ない。\`docs/operations/security/environment-secrets.md\` §Supabase Auth config の手順で手元確認）。redirect allowlist / captcha / MFA / signup の緩和は production ユーザーに直結する"
          fi
          if [ "$STORAGE_RESULT" = "failure" ]; then
            hints="$hints
          - **Storage RLS**: 401 なら \`SUPABASE_STORAGE_RLS_AUDIT_TOKEN\` の 90 日期限（2026-08-25 発行、#2345）または失効。\`docs/operations/secrets.md\` の \`ci/supabase-storage-rls-audit\` を再発行して GitHub Secret を更新する。それ以外は production の \`storage.objects\` policy / \`avatars\` bucket の drift（#2316 と同クラス）。**この job が止まっている間、production の storage RLS を見る目は無い**"
          fi
          body="production の Supabase 側 audit が失敗した（起動: \`$EVENT_NAME\`）。

          | job | result |
          | --- | --- |
          | Audit Supabase Auth config | \`$AUTH_RESULT\` |
          | Audit production storage.objects RLS | \`$STORAGE_RESULT\` |

          run: $RUN_URL
          $hints

          直したら **この issue は手で close する**（自動で閉じる経路は無い）。同じ title prefix の open issue があれば追記するので、失敗が続いても issue は増えない。

          このコメントは \`production-config-audit.yml\` の \`notify-supabase-audit-failure\` job による自動起票/追記。"

          existing=$(TITLE_PREFIX="$title_prefix" gh issue list --repo "$GITHUB_REPOSITORY" \
            --label "area:operations" --state open --json number,title \
            --jq '[.[] | select(.title | startswith(env.TITLE_PREFIX))][0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title_prefix" \
              --label "area:operations,quality:security,priority:p1" \
              --body "$body"
          fi
