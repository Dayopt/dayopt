name: CI

# CI ファイル統合（#2483 Phase 1）: 旧 ci.yml（gate/static/unit）+ docs-guard.yml
# （secret scan + docs 整合）+ integration.yml（migration-safety の静的スキャン +
# 層 3 撤去後に affected な PR だけ走る integration/RLS）を 1 ファイルへ統合した。
# 実行本体は scripts/ci/check.mjs（「薄い呼び出し層 + scripts 実体」再編）。
#
# job は impact →（static ∥ unit ∥ integration）の 2 段。**判定 job だけが直列で、
# 検査 3 本は並列**（2026-09-02、#2539）。分離前は 1 本の test job が Supabase 起動から
# unit・integration まで直列に抱え、さらに static の完走を待っていた。
#
# **実測値の正本は docs/engineering/infra.md §merge gate**（ここには数値を書かない。
# 同じ数字を複数箇所へ散らすと、次に構成を触る担当がどれを基準に退行を判断すべきか
# 分からなくなる。内製クロスレビュー risk-reviewer 指摘、P3）。
#
# affected 判定（docs-only skip・integration の DB-touch 判定・functions_changed）は
# scripts/ci/impact.mjs が正本で、impact job が 1 回だけ判定して job output へ出し、
# 下流 3 job はそれを再利用する（複数 job で gh api を叩いて結果がずれるリスクを避ける）。
#
# **fail-fast を捨てた**（旧: static が落ちたら下流を走らせない）。直近 50 run で
# static の failure は 0 件で、節約が一度も発動していなかったため。詳細は impact job の
# コメント。gate は緩まない（finish-branch.sh が各 job の success を名前で要求する）。

on:
  pull_request:
    branches: [main]
    # **`ready_for_review` を明示的に含める。** 既定の types は
    # `opened / synchronize / reopened` だけで ready_for_review を含まないため、
    # これが無いと draft → ready の変換で CI が再発火しない
    # （2026-08-03、PR #1810 で実測済みの罠）。
    types: [opened, synchronize, reopened, ready_for_review]
  # main への push では走らせない。branch:finish が「branch が main 最新を
  # 含み、その状態で CI green」をマージ前に強制するため（up-to-date gate）、
  # マージ後の main は常に PR で検証済みの tree と一致する。
  # 手動で main を検証したい時は workflow_dispatch を使う。
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# pull-requests: read は impact job の判定と unit job の migration safety（PR の変更
# ファイル一覧取得）に要る。書き込み権限（pull-requests: write / issues: write）は
# migration-notice job だけが job 単位で宣言する。integration job は gh を呼ばないため
# contents: read だけに絞ってある。
#
# **token 分離原則: PR head のコードや依存（checkout / setup / pnpm / node scripts）を
# 実行する job に write 権限を持たせない**（2026-09-14、credential audit P2-6）。
# scripts/__tests__/ci-token-isolation.test.ts が job 単位で機械検査する。
permissions:
  contents: read
  pull-requests: read

# ── draft 中は CI を完全に skip する（2026-08-28、#2483 Phase 1。User 裁可）──
# 検査網が要るのは境界を越える瞬間（ready = レビューする Main / User の時間を使う / merge = main に
# 入る）だけで、draft はレーンの私的作業場。機械 gate は pre-commit / pre-push
# フック（affected typecheck/lint + typecheck:scripts/test:scripts/format:check、
# #2359）が担う。**意図的な変更点は 2 つ**: (1) gitleaks が draft 中は走らない
# （旧 docs-guard.yml は draft 判定を持たず全 pull_request イベントで走っていた。
# pre-commit の gitleaks が一次防衛、CI（ready 後）は backstop という位置づけへ
# 変える）。(2) migration safety（破壊的 migration の静的スキャン）も draft 中は
# 走らない（旧 integration.yml の同ロジックは draft guard を持たず DB 不要の
# 静的スキャンとして常時実行していた。内製クロスレビュー risk-reviewer 指摘、
# P2、PR #2484）。それ以外の検査内容は削っていない。
#
# `draft != true` と書く（`== false` ではない）: workflow_dispatch では
# pull_request context が無く null になるため、`== false` だと手動実行で
# 全 job が skip される。
jobs:
  # ── 判定だけを行う軽量 job（全 job の上流）────────────────────────────
  #
  # **static から判定を切り出して、重い job が static の完走を待たない形にした**
  # （2026-09-02、#2539 続き）。分離前は static が判定を持っていたため
  # unit / integration が static の 4 分 20 秒を直列で待っていた。
  #
  # `pnpm install` を**あえて省く**。impact.mjs は node 標準ライブラリと workspace の
  # package.json しか読まないため、setup action（実測 26 秒）が丸ごと不要になる。
  # 依存を足す変更をこのファイルへ入れる時は、ここに setup が無いことを思い出すこと。
  #
  # fail-fast（static が落ちたら重い job を走らせない）を捨てた判断は実測に基づく:
  # 直近 50 run で static の failure は 0 件だった（success 28 / draft skip 20 /
  # cancelled 1）。同じ検査を pre-push フックが先に走らせるため、CI で static が
  # 落ちる経路がほぼ塞がっている。**節約が一度も発動していない直列**のために
  # 全 PR が 4 分待つのは割に合わない。static が落ちた run で unit も走るように
  # なるが、merge は通らない（finish-branch.sh が `🔍 Static Checks` の success を
  # 名前で要求する）。**緩むのは課金だけで gate は緩まない。**
  impact:
    name: "\U0001F9ED Impact"
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.run.outputs.docs_only }}
      product_unit: ${{ steps.run.outputs.product_unit }}
      mcp_conformance: ${{ steps.run.outputs.mcp_conformance }}
      integration: ${{ steps.run.outputs.integration }}
      functions_changed: ${{ steps.run.outputs.functions_changed }}
      migrations_added: ${{ steps.run.outputs.migrations_added }}
    steps:
      # 判定は gh api の PR files 一覧だけを入力にするため、履歴は要らない。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve impact
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/ci/check.mjs impact

  static:
    name: "\U0001F50D Static Checks"
    needs: impact
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks の diff scan と docs:check の append-only guard が
          # base ref との差分を見るため full history が必要（旧 docs-guard.yml と同じ）
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Run static checks
        # **GH_TOKEN は渡さない**（内製クロスレビュー risk-reviewer 指摘、P2）。
        # gh を使う唯一の処理（PR files 一覧の取得）は impact job へ移り、この job に
        # gh 依存は残っていない（secrets:check / docs:check / lane のいずれも gh を
        # 呼ばないことを確認済み）。PR コードとその全依存を実行する job に不要な
        # token を置かない — integration job と同じ原則。
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DOCS_ONLY: ${{ needs.impact.outputs.docs_only }}
          FUNCTIONS_CHANGED: ${{ needs.impact.outputs.functions_changed }}
        run: node scripts/ci/check.mjs static

  # ── unit と integration を別 job に分ける（2026-09-02、#2539）─────────
  #
  # 分割理由は **直列だった 2 種類の検査の並列化**。分割前は 1 job の中で
  # 「Supabase 起動（約 3 分）→ unit（約 7 分）→ integration（約 1.6 分）」が直列に
  # 並んでいた。分割後は別 runner で同時に走る。**検査内容は 1 つも削っていない。**
  #
  # **CPU 競合説は実測で否定された**（当初の仮説）。product unit test の所要は
  # Supabase 同居時 5 分 06 秒 / 非同居時 4 分 55 秒で差は 3.6%。分割前に
  # 「integration skip の PR は 1〜2 分」に見えたのは、それらが同時に
  # `product_unit=false` だった交絡。**product unit の 5 分はこの分割では縮んでいない**。
  #
  # job 名 `📦 Unit Tests` は `scripts/tasks/finish-branch.sh` が merge gate として
  # 名前で success を要求する（#2415）。**改名する場合は finish-branch.sh の
  # REQUIRED_CI_CHECKS も同時に変更すること**（片方だけ直すと merge が永久に止まる）。
  unit:
    name: "\U0001F4E6 Unit Tests"
    needs: impact
    # `always()` を付けるのは、上流 job 自体が落ちた時に下流が skip されると
    # 「検証なしで required check が success」になる（fail open）ため。always()
    # なら impact 失敗時も評価され、空の output は `!= 'true'` で実行側に倒れる。
    if: ${{ !cancelled() && github.event.pull_request.draft != true && needs.impact.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # **write 権限を持たない**（2026-09-14、credential audit P2-6）。この job は PR head の
    # テストコードと全依存（postinstall・vitest transform・plugin）を実行する。以前は
    # migration safety の通知のために pull-requests: write / issues: write を持ち、
    # check.mjs 内で GH_TOKEN を env から押収するだけが防御だった（同じ step で動く
    # PR head の check.mjs 自身は token を読める）。通知は下流の migration-notice job へ
    # 移し、ここは検知結果を job output へ出すだけにする。GH_TOKEN は read-only で、
    # PR の変更ファイル一覧の取得（gh api）にだけ使う。
    permissions:
      contents: read
      pull-requests: read
    outputs:
      migration_destructive: ${{ steps.run.outputs.migration_destructive }}
      migration_comment_b64: ${{ steps.run.outputs.migration_comment_b64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # migration safety の git fallback（check.mjs の fetchPrFilesFromGit）が
          # `refs/pull/N/merge` の第 1 親を diff base に使う。1（既定の shallow）へ
          # 戻すと親 object が無く、認証の要る `git fetch` しか残らないので private repo で
          # fallback が死ぬ（→ undeterminable → この job が赤。#2750）
          fetch-depth: 2
          persist-credentials: false

      - uses: ./.github/actions/setup

      # product unit は PR では変更から届く test（vitest related）+ fs を読む契約 test に絞り、
      # full は nightly.yml の product-unit-full が毎日走らせる（check.mjs resolveProductUnitScope、#2743）。
      - name: Run unit tests (+ migration safety)
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PRODUCT_UNIT: ${{ needs.impact.outputs.product_unit }}
          MCP_CONFORMANCE: ${{ needs.impact.outputs.mcp_conformance }}
          NODE_ENV: test
          CI: true
        run: node scripts/ci/check.mjs unit

  # ── migration safety の通知（ラベル + PR コメント）───────────────────
  #
  # **write 権限を持つ唯一の job。checkout も依存 install もせず、repo のコードを
  # 1 行も実行しない**（2026-09-14、credential audit P2-6）。runner 同梱の gh / base64 だけで
  # 完結する。入力の unit job output は PR head のコードが書いた値なので信用しない:
  # フラグは `true` 完全一致、本文は base64 の文字集合を検証してから decode し、
  # シェルへは env 経由でだけ渡す（`${{ }}` を run に展開しない）。PR 番号と repo は
  # event context から取る。
  #
  # 挙動は unit job に同居していた頃（check.mjs の runMigrationSafety）と同じ:
  # 付与済みなら再通知しない → ラベル作成（既存なら無視）→ コメント投稿 → 成功時だけ
  # ラベル付与（crash-safety: 通知前に打ち切られてラベルだけ残る状態を避ける）。
  # 失敗はすべて fail open（warning のみで exit 0）。finish-branch.sh は rollup の
  # failure を merge 阻止に使うため、通知の失敗で merge を止めない。
  #
  # `!cancelled()`: coupled migration で unit job が hard fail した PR こそ通知が要る。
  # unit が skip（draft / docs-only）なら output が空で skip される。**required check に
  # しない**（検知が無い PR では常に skip され、名前照合の gate に載せる意味がない）。
  migration-notice:
    name: Migration Safety Notice
    needs: unit
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.unit.outputs.migration_destructive == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Label and comment destructive migration
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MIGRATION_DESTRUCTIVE: ${{ needs.unit.outputs.migration_destructive }}
          MIGRATION_COMMENT_B64: ${{ needs.unit.outputs.migration_comment_b64 }}
        run: |
          label='db:destructive-migration'
          if [ "${MIGRATION_DESTRUCTIVE:-}" != 'true' ]; then
            echo "migration_destructive が true ではないため通知しません。"
            exit 0
          fi
          if ! [[ "${PR_NUMBER:-}" =~ ^[1-9][0-9]*$ ]] || ! [[ "${GH_REPO:-}" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::warning::migration safety: PR 番号または repo を解決できないため通知しません。"
            exit 0
          fi
          if ! [[ "${MIGRATION_COMMENT_B64:-}" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] || (( ${#MIGRATION_COMMENT_B64} % 4 != 0 )); then
            echo "::warning::migration safety: コメント本文の output が不正なため通知しません。Unit Tests の Step Summary を確認してください。"
            exit 0
          fi
          body_file="${RUNNER_TEMP:?}/migration-safety-comment.md"
          if ! printf '%s' "$MIGRATION_COMMENT_B64" | base64 -d > "$body_file" 2>/dev/null; then
            echo "::warning::migration safety: コメント本文を decode できないため通知しません。Unit Tests の Step Summary を確認してください。"
            exit 0
          fi

          # round ごとの追い push で毎回コメントしない。取得失敗は未付与扱い（fail open）。
          has_label=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
            --jq "[.[] | select(.name == \"$label\")] | length > 0" 2>/dev/null) || has_label=false
          if [ "$has_label" = 'true' ]; then
            echo "$label は付与済みのため再通知しません。"
            exit 0
          fi

          gh label create "$label" --repo "$GH_REPO" --color B60205 \
            --description '破壊的 migration を検知（EXPLICIT AUTHORITY 要確認）' > /dev/null 2>&1 || true

          if gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body-file "$body_file"; then
            gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
              -f "labels[]=$label" > /dev/null || true
          else
            # fork PR では pull_request イベントの GITHUB_TOKEN が構造的に read-only になる
            echo "::warning::migration safety のコメント投稿に失敗しました（fork PR 等で write 権限が無い可能性）。Unit Tests の Step Summary の検知結果を確認してください。"
          fi

  # ── integration / RLS（DB を触る PR だけ。unit job と並列に走る）──────
  #
  # job 名 `🧪 Integration Tests` は finish-branch.sh が **affected な PR でだけ**
  # 名前で success を要求する（skip される PR で要求すると merge が永久に止まる）。
  # 改名時は finish-branch.sh 側も同時に変更すること。
  #
  # `!= 'false'`（`== 'true'` ではない）: check.mjs の shouldRunIntegrationTests
  # と同じ fail-closed 方向（判定不能なら実行する）に揃える。output が空になる
  # 経路は impact 失敗時は空になり実行側へ倒れるが、guard の
  # 向きが 2 箇所で食い違っていると将来の配線変更でサイレントに壊れる
  # （内製クロスレビュー risk-reviewer 指摘、P3）。
  #
  # **`docs_only` を条件に入れない**（#2552）: impact.mjs は integration を docs
  # とも app とも独立に判定しており、`docs/engineering/data/db/rls-snapshot.md`
  # のように「docs パスだが integration 対象」のファイルがある。ここで
  # `docs_only != 'true'` を AND すると、rls-snapshot.md 単独の PR で
  # `rls:snapshot:check`（RLS drift 検査）が一度も走らないまま merge できてしまう
  # （snapshot を先に緩めておいてから RLS を緩める migration を出す 2 段階の
  # 通過経路になる）。unit job 側の docs_only 条件はそのままでよい。
  # finish-branch.sh の REQUIRED_CI_CHECKS も同じ向きで独立させてある。
  integration:
    name: "\U0001F9EA Integration Tests"
    needs: impact
    if: ${{ !cancelled() && github.event.pull_request.draft != true && needs.impact.outputs.integration != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # gh を呼ばないため write 権限も GH_TOKEN も渡さない（migration safety は
    # unit job と migration-notice job 側が担う）。PR コードを実行する job に書き込み token を置かない
    # という token 分離原則（PR #2484 の P1 指摘）を、権限そのものを与えない形で満たす。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - id: supabase-version
        run: |
          version=$(node -p "require('./package.json').devDependencies.supabase")
          if [ "$version" = "undefined" ] || [ -z "$version" ]; then
            echo "::error::supabase CLI version の抽出に失敗しました（root package.json の devDependencies.supabase を確認してください）: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: ${{ steps.supabase-version.outputs.version }}

      - name: Start Supabase
        run: supabase start

      - name: Get Supabase status
        id: supabase
        run: |
          API_URL=$(supabase status --output json | jq -r '.API_URL')
          ANON_KEY=$(supabase status --output json | jq -er '.PUBLISHABLE_KEY // .ANON_KEY | select(type == "string" and length > 0)')
          SERVICE_ROLE_KEY=$(supabase status --output json | jq -er '.SECRET_KEY // .SERVICE_ROLE_KEY | select(type == "string" and length > 0)')
          DB_URL=$(supabase status --output json | jq -r '.DB_URL')
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "anon_key=$ANON_KEY" >> $GITHUB_OUTPUT
          echo "service_role_key=$SERVICE_ROLE_KEY" >> $GITHUB_OUTPUT
          echo "db_url=$DB_URL" >> $GITHUB_OUTPUT

      - name: Run integration/RLS tests
        env:
          INTEGRATION_AFFECTED: ${{ needs.impact.outputs.integration }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase.outputs.anon_key }}
          SUPABASE_SECRET_KEY: ${{ steps.supabase.outputs.service_role_key }}
          DATABASE_URL: ${{ steps.supabase.outputs.db_url }}
          USE_LOCAL_DB: 'true'
          NODE_ENV: test
          CI: true
        run: node scripts/ci/check.mjs integration

      - name: Stop Supabase
        if: always()
        run: supabase stop

  # ── DB upgrade / old-consumer（migration を追加した PR だけ。shadow、非必須）──────
  #
  # integration job の `supabase start` は candidate の migration 集合を **空 DB へ** 適用する
  # fresh 経路しか証明しない（#2797）。この job は base の migration 集合 + seed（合成データ）まで
  # reset し、PR が追加した migration だけを当てて、適用エラー・seed 行の消失・fresh との
  # schema 不一致・base 世代の生成型が参照するオブジェクトの消失（旧アプリ × 新 DB）を
  # 別々に検出する（scripts/ci/db-upgrade-check.mjs）。
  #
  # **required check ではない**（#2798 の比較・承認後に扱いを決める）。Validation controller
  # は plan の dbUpgrade / oldConsumer をこの job 名に束縛する。job 名を変える時は
  # validation-evidence の PRODUCERS と ci-job-name-contract.test.ts も直す。
  #
  # migration を追加していない PR では impact の `migrations_added` が空で skip される
  # （plan 側も not-applicable）。`fetch-depth: 2` は merge commit の第 1 親（base）を
  # `git ls-tree` / `git show` で読むため。接続先はローカル Docker だけ。
  db-upgrade:
    name: "\U0001F9F1 DB Upgrade (shadow)"
    needs: impact
    if: ${{ !cancelled() && github.event.pull_request.draft != true && needs.impact.outputs.migrations_added == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: ./.github/actions/setup

      - id: supabase-version
        run: |
          version=$(node -p "require('./package.json').devDependencies.supabase")
          if [ "$version" = "undefined" ] || [ -z "$version" ]; then
            echo "::error::supabase CLI version の抽出に失敗しました（root package.json の devDependencies.supabase を確認してください）: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: ${{ steps.supabase-version.outputs.version }}

      - name: Start Supabase
        run: supabase start

      - name: Upgrade from the base migration set and compare with the fresh schema
        env:
          DB_UPGRADE_RESULT_PATH: db-upgrade-result.json
          NODE_ENV: test
          CI: true
        run: node scripts/ci/db-upgrade-check.mjs

      - name: Save upgrade result
        if: always() && hashFiles('db-upgrade-result.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: db-upgrade-result-${{ github.run_attempt }}
          path: db-upgrade-result.json
          retention-days: 14

      - name: Stop Supabase
        if: always()
        run: supabase stop
