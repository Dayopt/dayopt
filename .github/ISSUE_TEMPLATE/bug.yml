name: バグ報告
description: 想定と異なる挙動の報告
title: 'bug: '
labels: ['type:bug']
body:
  - type: markdown
    attributes:
      value: |
        `priority:` / `area:` は [github-labels.md](https://github.com/Dayopt/dayopt/blob/main/docs/operations/github-labels.md) の一覧から選んで追加する。**milestone は付けない**（着手時に Main が付与する。`.agents/skills/dispatch/SKILL.md` 操作 A）。
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 解決する問題と期待する変化。再現手順、期待した挙動と実際の挙動、確認済み事実と未確認の仮説、関連 issue / PR へのリンク
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: やること
      description: 'Goal、Scope / Non-goals、受け入れ条件、未解決事項を書く。必要な場合だけ手順・対象 path を示し、確認していない実装方法を確定事項にしない'
    validations:
      required: true
  - type: textarea
    id: caution
    attributes:
      label: 注意
      description: 触らない範囲、権限境界、外部作用、必要な停止・復帰条件。該当なしの場合は理由を書く（例 Supabase skill のフロー）
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 検証
      description: 受け入れ条件を確かめる実行可能なコマンドまたは具体的な手順。必要な検証と実行済みの結果を分け、未実行・失敗も記録
      placeholder: pnpm check / pnpm test:run など
    validations:
      required: true
