version: 2
updates:
  # npm依存関係の自動更新
  # private repo の Actions 実行は GitHub Team プランの included minutes を消費するため、
  # monthly に間引く（Dependabot PR ごとにフル CI が走るため）。
  # security update は Dependabot security updates が schedule と無関係に即時 PR を出す。
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '09:00'
      timezone: 'Asia/Tokyo'

    # PR数の制限（grouping を細分化したため少し増やす）
    open-pull-requests-limit: 6

    # ラベル設定（securityは自動付与に任せる）
    labels:
      - 'type:chore'

    # レビュアー設定
    reviewers:
      - 't3-nico'

    # アサイン設定
    assignees:
      - 't3-nico'

    # コミットメッセージ設定
    commit-message:
      prefix: 'chore'
      include: 'scope'

    # グループ化設定
    # development を 1 グループにまとめると 30+ 件の bundle になり、storybook /
    # playwright / tailwindcss など互いに無関係な breaking が混ざって blast radius
    # を読めなくなるため、エコシステム単位で細分化する。
    groups:
      production:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'

      # storybook は addon 同士の version を揃える必要があるためまとめる
      development-storybook:
        patterns:
          - '@storybook/*'
          - 'storybook'
          - 'eslint-plugin-storybook'
        update-types:
          - 'minor'
          - 'patch'

      # テストランナー / E2E ツールは互いに依存があるためまとめる
      development-testing:
        patterns:
          - '@playwright/*'
          - 'playwright'
          - '@axe-core/*'
          - 'vitest'
          - '@vitest/*'
          - 'happy-dom'
          - '@testing-library/*'
        update-types:
          - 'minor'
          - 'patch'

      # lint / format / type ツール群
      development-linting:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'prettier'
          - 'prettier-plugin-*'
          - '@commitlint/*'
        update-types:
          - 'minor'
          - 'patch'

      # @types/* は受け身の型更新で blast radius が小さい
      development-types:
        patterns:
          - '@types/*'
        update-types:
          - 'minor'
          - 'patch'

      # 上記グループに属さない残りの dev deps
      development-other:
        dependency-type: 'development'
        exclude-patterns:
          - '@storybook/*'
          - 'storybook'
          - 'eslint-plugin-storybook'
          - '@playwright/*'
          - 'playwright'
          - '@axe-core/*'
          - 'vitest'
          - '@vitest/*'
          - 'happy-dom'
          - '@testing-library/*'
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'prettier'
          - 'prettier-plugin-*'
          - '@commitlint/*'
          - '@types/*'
        update-types:
          - 'minor'
          - 'patch'

    # major更新は除外（手動で慎重に対応）
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'

    # 競合時の自動リベース
    rebase-strategy: 'auto'

  # GitHub Actions の自動更新
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '09:00'
      timezone: 'Asia/Tokyo'

    labels:
      - 'type:chore'
      - 'area:infrastructure'

    reviewers:
      - 't3-nico'

    assignees:
      - 't3-nico'

    commit-message:
      prefix: 'chore(deps)'
